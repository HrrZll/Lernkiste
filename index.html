{id:"10d",name:"Klasse 10d",color:"#347c83",faecher:[
 {id:"d",name:"Deutsch",icon:"book",color:"#347c83",units:[
  {id:"10d-a2",titel:"A2 (10): Materialgestützte Argumentation und dass / das",ziel:"Ich kann eine materialgestützte Argumentation schreiben. Ich kenne die Regeln der Kommasetzung. Ich kann dass und das korrekt anwenden.",prefix:"A2(10)",ka:{d:"2026-12-18",txt:"Klassenarbeit",geplant:false},sections:[
  SEC("Neuerungen",[
   KAP(1,"Unterschied Erörterung ← → Argumentation","Ich kenne den Unterschied zwischen einer Erörterung und der materialgestützten Argumentation.","2026-11-17",[
    MC(1,"Was ist das wichtigste Merkmal einer materialgestützten Argumentation?",["Du belegst deine Argumente mit Informationen aus vorgegebenen Materialien.","Du schreibst nur aus deinem eigenen Wissen.","Du erzählst eine Geschichte.","Du fasst einen Text zusammen."],"Der Name verrät es.","Materialgestützt: Die Argumente werden mit M1, M2 … belegt."),
    SO(1,"Typisch für die Erörterung oder für die materialgestützte Argumentation?",["Erörterung","Materialgestützte Argumentation"],[["Die Argumente stammen vor allem aus dem eigenen Wissen.",0],["Die Argumente werden mit Verweisen auf M1 bis M4 belegt.",1],["Der Text richtet sich an einen bestimmten Adressaten, z. B. die Schulleitung.",1],["Pro und Contra werden abgewogen, am Ende steht ein Urteil.",0],["Die Textform ist vorgegeben, z. B. ein Leserbrief.",1]],"Denk an Materialien, Adressat und Textform.","Die Erörterung wägt aus eigenem Wissen ab. Die materialgestützte Argumentation nutzt Materialien und hat Adressat und Textform."),
    TF(1,"Bevor du schreibst, wertest du die Materialien gründlich aus.",true,"Woher kommen deine Belege?","Richtig. Erst auswerten, dann planen, dann schreiben."),
    OR(2,"Bringe den Schreibprozess in die richtige Reihenfolge.",["Aufgabe und Operator genau lesen","Materialien auswerten und markieren","Schreibplan mit Argumenten erstellen","Text schreiben","Text überarbeiten"],"Erst verstehen, dann sammeln, dann planen.","Lesen – auswerten – planen – schreiben – überarbeiten."),
    TF(2,"In einer einseitigen Argumentation kannst du trotzdem ein Gegenargument aufgreifen und entkräften.",true,"Das kommt in Kapitel 4.","Richtig. Das macht die eigene Position glaubwürdiger."),
    FR(3,"Erkläre in zwei bis drei Sätzen den Unterschied zwischen einer Erörterung und einer materialgestützten Argumentation.","Bei einer Erörterung wägst du Pro und Contra zu einer Frage vor allem mit eigenem Wissen ab und kommst zu einem Urteil. Bei einer materialgestützten Argumentation wertest du vorgegebene Materialien aus und belegst deine Argumente mit Verweisen oder Zitaten. Außerdem schreibst du für einen bestimmten Adressaten in einer vorgegebenen Textform.","Materialien, Adressat, Textform.")])]),
  SEC("Argumente",[
   KAP(2,"Argumente ordnen","Ich kann Pro- und Contra-Argumente ordnen.","2026-11-17",[
    MC(1,"Nach welchem Prinzip ordnest du Argumente meistens?",["steigernd: das stärkste zum Schluss","fallend: das stärkste zuerst","nach Länge","alphabetisch"],"Was bleibt am Ende im Kopf?","Steigernd – das stärkste Argument wirkt am Schluss am meisten."),
    HA_SORT(1),
    MC(2,"Thema: längere Mittagspause. Welches Argument wirkt bei der Schulleitung am stärksten?",["Mit einer längeren Pause können alle in Ruhe essen und sind am Nachmittag konzentrierter.","Wir hätten mehr Zeit zum Zocken.","Andere Schulen haben das auch.","Ich mag kurze Pausen nicht."],"Was ist für die Schulleitung wichtig?","Das erste Argument betrifft das Lernen – das interessiert die Schulleitung."),
    MC(3,"Warum steht das stärkste Argument am Schluss?",["Weil es den Leser:innen am besten im Gedächtnis bleibt","Weil es am kürzesten ist","Weil man es sonst vergisst","Weil es die Regel so will"],"Denk an das Ende eines Films.","Was zuletzt kommt, wirkt nach."),
    FR(3,"Wähle drei Pro-Argumente für Hausaufgaben und ordne sie steigernd. Begründe kurz, warum das letzte am stärksten ist.","1. Man lernt, selbstständig zu arbeiten.\n2. Durch Hausaufgaben wiederholt man die Themen des Unterrichts.\n3. Hausaufgaben bereiten auf Klassenarbeiten vor.\nDas letzte ist am stärksten, weil es direkt mit besseren Leistungen zu tun hat und alle betrifft.","Schwächstes zuerst, stärkstes zuletzt.")]),
   KAP(3,"Aufbau eines Arguments","Ich kenne den Aufbau eines Arguments und unterscheide Behauptung, Begründung und Beispiel.","2026-11-20",[
    OR(1,"Bringe die Bausteine eines Arguments in die richtige Reihenfolge.",["Behauptung","Begründung","Beispiel oder Beleg"],"Was willst du zeigen – warum – woran sieht man es?","Behauptung – Begründung – Beispiel/Beleg."),
    MC(1,"Welcher Satz ist eine Behauptung?",["Ein Handyverbot an Schulen ist nicht sinnvoll.","Zum Beispiel nutzen viele Lern-Apps.","…, weil Jugendliche Medienkompetenz lernen müssen.","Wie M2 zeigt, …"],"Die Behauptung ist die These, die du beweisen willst.","Die Behauptung ist die These. Die anderen sind Beispiel, Begründung und Beleg."),
    SO(2,"Ordne die Teile den Bausteinen zu.",["Behauptung","Begründung","Beispiel"],[["Ein kostenloser ÖPNV entlastet die Umwelt,",0],["weil mehr Menschen das Auto stehen lassen.",1],["In manchen Städten fahren mit Gratis-Tickets beispielsweise deutlich mehr Menschen Bus.",2],["Schulbeginn um neun Uhr verbessert die Leistungen,",0],["denn Jugendliche sind morgens oft unausgeschlafen.",1],["So schreiben viele in der ersten Stunde schlechter als in der dritten.",2]],"Signalwörter: weil, denn, beispielsweise, so …","Zwei vollständige Argumente – jeweils Behauptung, Begründung, Beispiel."),
    MC(2,"Welcher Baustein fehlt? „Ein kostenloser ÖPNV ist sinnvoll. Zum Beispiel könnten Jugendliche dann allein zum Training fahren.“",["die Begründung","die Behauptung","das Beispiel","nichts"],"Warum ist es sinnvoll?","Es fehlt die Begründung, z. B.: …, weil auch Menschen mit wenig Geld mobil wären."),
    TF(3,"Ein Beleg aus dem Material kann die Rolle des Beispiels übernehmen.",true,"Beides macht die Begründung konkret.","Richtig. In der materialgestützten Argumentation ist ein Materialbeleg oft der stärkste Beleg."),
    FR(3,"Schreibe ein vollständiges Argument (Behauptung, Begründung, Beispiel) zum Thema Handyverbot an Schulen.","Ein komplettes Handyverbot an Schulen ist nicht sinnvoll, weil Jugendliche einen verantwortungsvollen Umgang mit dem Handy lernen müssen. So kann man im Unterricht zum Beispiel üben, seriöse Nachrichtenquellen zu erkennen.","weil … / zum Beispiel …")]),
   KAP(4,"Gegenargumente entkräften","Ich kann ein Gegenargument aufgreifen und entkräften.","2026-11-20",[
    GAP(1,"Wähle die passenden Wörter.","{0} lenken Handys im Unterricht ab, {1} mit klaren Regeln lässt sich das Problem lösen.",[["Zwar","Weil","Damit"],["doch","denn","weil"]],"Zugeständnis + Einwand.","„Zwar …, doch …“ ist eine typische Formulierung zum Entkräften."),
    TF(1,"Wer ein Gegenargument aufgreift, wirkt glaubwürdiger.",true,"Man sieht, dass du die andere Seite kennst.","Richtig."),
    MC(2,"Deine Position: kein komplettes Handyverbot. Gegenargument: „Handys lenken vom Unterricht ab.“ Welche Entkräftung überzeugt am meisten?",["Zwar können Handys ablenken, doch klare Regeln – etwa Handys im Unterricht in der Tasche – lösen dieses Problem, ohne die sinnvolle Nutzung zu verbieten.","Handys lenken nicht ab.","Lehrkräfte sind auch oft am Handy.","Das ist ein schlechtes Argument."],"Gib etwas zu und biete eine Lösung an.","Die erste Antwort nimmt das Argument ernst und entkräftet es mit einem Lösungsvorschlag."),
    MA(2,"Ordne jeder Strategie den passenden Satz zu.",[["einschränken","Das trifft höchstens auf einen kleinen Teil der Schüler:innen zu."],["widerlegen","Die Umfrage in M3 zeigt jedoch das Gegenteil."],["Lösung anbieten","Dieses Problem lässt sich durch feste Handyzeiten lösen."],["gewichten","Selbst wenn das stimmt, überwiegen die Vorteile deutlich."]],"Widerlegen braucht einen Gegenbeleg.","So kannst du Gegenargumente unterschiedlich entkräften."),
    MC(3,"Welche Entkräftung ist sachlich UND begründet?",["Es stimmt zwar, dass ein Gratis-Ticket Geld kostet. Dem ist jedoch entgegenzuhalten, dass dadurch Kosten für Straßen und Parkplätze sinken.","Wer das sagt, hat keine Ahnung.","Geld ist doch egal.","Dem ist nichts entgegenzuhalten."],"Zugeständnis + Gegenbegründung, ohne Angriff.","Nur die erste Antwort gibt etwas zu, bleibt sachlich und begründet."),
    FR(3,"Thema: Soll der ÖPNV für Schüler:innen kostenlos sein? Schreibe ein Argument für deine Position und entkräfte ein Gegenargument.","Argument: Ein kostenloser ÖPNV für Schüler:innen ist sinnvoll, weil alle unabhängig vom Geldbeutel der Eltern mobil sind. So könnten zum Beispiel auch Jugendliche aus ärmeren Familien Ausbildungsplätze in der Nachbarstadt erreichen.\nEntkräftung: Zwar kostet das die Kommunen Geld, doch ein Teil davon wird gespart, weil weniger Eltern Fahrdienste mit dem Auto leisten und weniger Verkehr entsteht.","Behauptung – Begründung – Beispiel; dann „Zwar …, doch …“.")])]),
  SEC("Mit Material arbeiten",[
   KAP(5,"Argumente aus einem Sachtext herausarbeiten","Ich kann mithilfe der 3-Schritt-Lesemethode aus einem Sachtext Argumente herausarbeiten.","2026-11-24",SACHTEXT_OEPNV()),
   KAP(6,"Richtig zitieren","Ich kann auf Material verweisen und richtig zitieren.","2026-11-26",[
    TF(1,"Bei einem wörtlichen Zitat setzt du Anführungszeichen und nennst die Quelle.",true,"Zitat = wörtlich.","Richtig, z. B. „…“ (M2, Z. 5)."),
    MC(1,"Was ist ein Verweis?",["Du gibst den Inhalt eines Materials sinngemäß wieder und nennst die Quelle.","Du übernimmst einen Satz wörtlich.","Du nennst nur deine eigene Meinung.","Du schreibst die Überschrift ab."],"Sinngemäß = mit eigenen Worten.","Ein Verweis gibt den Inhalt sinngemäß wieder, oft mit „vgl.“."),
    MC(1,"Wofür steht „vgl.“ bei einer Quellenangabe?",["vergleiche","vorgelesen","vielleicht gelogen","vorgegeben"],"Man soll selbst nachsehen und vergleichen.","„vgl.“ = vergleiche. Man nutzt es bei sinngemäßer Wiedergabe."),
    MC(1,"Wie kennzeichnest du eine Auslassung in einem Zitat?",["[…]","***","//","~"],"Eckige Klammern.","Mit […]."),
    SO(2,"Zitat oder Verweis?",["Zitat","Verweis"],[["Laut M2 nutzen vor allem Jugendliche den Bus.",1],["In M1 heißt es: „Die Preise sind seit Jahren gestiegen“ (M1, Z. 3).",0],["Wie die Grafik in M3 zeigt, ist der Anteil der Autofahrten gesunken.",1],["„Ein Gratis-Ticket allein reicht nicht“ (M4, Z. 8).",0]],"Anführungszeichen?","Zitat = wörtlich in Anführungszeichen. Verweis = sinngemäß."),
    MC(2,"Welche Formulierung leitet einen Verweis ein?",["Wie aus M2 hervorgeht, …","Meiner Meinung nach …","Abschließend …","Zweitens …"],"Ein Material muss genannt werden.","„Wie aus M2 hervorgeht“ verweist auf ein Material."),
    OR(2,"Bringe die Bausteine eines Arguments mit Materialbeleg in eine sinnvolle Reihenfolge.",["Behauptung","Begründung","Beleg aus dem Material","Erläuterung und Rückbezug"],"Der Beleg stützt die Begründung, die Erläuterung verbindet ihn mit der Behauptung.","Behauptung – Begründung – Beleg – Erläuterung."),
    MC(2,"Welcher Satz gibt M2 korrekt in indirekter Rede wieder?",["In M2 wird betont, dass der Bus oft zu spät komme.","In M2 wird betont, dass der Bus oft zu spät kommen würde gewesen.","In M2 wird betont: der Bus kommt zu spät.","M2 sagt, Bus spät."],"Indirekte Rede steht im Konjunktiv I.","„komme“ ist Konjunktiv I – so gibst du fremde Aussagen neutral wieder."),
    MC(3,"Welcher Satz zitiert korrekt?",["Die Autorin betont, dass „ein Gratis-Ticket […] nicht reicht“ (M4, Z. 8).","Die Autorin betont, dass ein Gratis-Ticket nicht reicht.","Die Autorin betont: „Gratis-Tickets sind schlecht“ (M4, Z. 8).","„Gratis-Ticket […] reicht“"],"Anführungszeichen, gekennzeichnete Auslassung und Quelle.","Nur der erste Satz ist wörtlich, kennzeichnet die Auslassung und nennt die Quelle."),
    TF(3,"Ein Zitat musst du erläutern und mit deiner Behauptung verbinden.",true,"Sonst steht es nur da.","Richtig. Erst die Erläuterung macht das Zitat zum Beleg."),
    FR(3,"Material M2 (ausgedacht): „Seit dem Gratis-Ticket fahren an Schultagen rund ein Drittel mehr Jugendliche mit dem Bus.“ Formuliere daraus ein Argument mit Zitat.","Ein kostenloses Schülerticket stärkt den ÖPNV, weil es Jugendliche zum Umstieg bewegt. So heißt es in M2, dass „an Schultagen rund ein Drittel mehr Jugendliche mit dem Bus“ fahren (M2, Z. 1). Das zeigt, dass der Preis eine echte Hürde war und ein Gratis-Ticket das Verhalten tatsächlich verändert.","Behauptung – Begründung – Zitat mit Quelle – Erläuterung.")])]),
  SEC("Richtig schreiben beim Argumentieren",[
   KAP(7,"Kommasetzung in Satzgefügen","Ich kann Kommas in Satzgefügen korrekt setzen.","2026-11-27",[
    TF(1,"Zwischen Hauptsatz und Nebensatz steht immer ein Komma.",true,"Satzgefüge.","Richtig. Haupt- und Nebensatz werden immer durch Komma getrennt."),
    MC(1,"Wo fehlt das Komma? „Ich glaube dass der Vorschlag sinnvoll ist.“",["vor „dass“","nach „dass“","vor „sinnvoll“","nach „Ich“"],"Der Nebensatz beginnt mit „dass“.","Ich glaube, dass der Vorschlag sinnvoll ist."),
    MK(1,"Tippe das Wort an, vor das ein Komma gehört.","Wir|fahren|mit|dem|Rad|*weil|der|Bus|ausfällt.","Wo beginnt der Nebensatz?","Wir fahren mit dem Rad, weil der Bus ausfällt."),
    MC(1,"Welche Konjunktion leitet einen Nebensatz ein?",["obwohl","und","aber","denn"],"Nach ihr steht das finite Verb am Ende.","„obwohl“ ist unterordnend. und, aber, denn sind nebenordnend."),
    MC(2,"Welcher Satz ist richtig?",["Der Vorschlag, den die SMV gemacht hat, ist gut.","Der Vorschlag den die SMV gemacht hat, ist gut.","Der Vorschlag, den die SMV gemacht hat ist gut.","Der Vorschlag den die SMV gemacht hat ist gut."],"Ein eingeschobener Nebensatz wird vorn und hinten abgetrennt.","Eingeschobene Nebensätze stehen zwischen zwei Kommas."),
    MK(2,"Tippe alle Wörter an, vor die ein Komma gehört.","Als|der|Bus|endlich|kam|*waren|alle|froh|*weil|es|regnete.","Es sind zwei Kommas: nach dem Nebensatz am Anfang und vor dem Nebensatz am Ende.","Als der Bus endlich kam, waren alle froh, weil es regnete."),
    TF(2,"Vor „und“ zwischen zwei Hauptsätzen muss ein Komma stehen.",false,"Hier hast du die Wahl.","Falsch. Das Komma ist hier freigestellt (man kann es setzen, muss aber nicht)."),
    SO(2,"Satzreihe oder Satzgefüge?",["Satzreihe","Satzgefüge"],[["Die Schule plant einen Projekttag, aber der Termin steht noch nicht fest.",0],["Die SMV fordert, dass die Pausen länger werden.",1],["Wenn das Wetter mitspielt, findet das Sportfest draußen statt.",1],["Der Bus war voll, deshalb kam ich zu spät.",0]],"Gibt es einen Nebensatz mit Verb am Ende?","Satzgefüge = Hauptsatz + Nebensatz. Satzreihe = nur Hauptsätze."),
    MK(3,"Tippe alle Wörter an, vor die ein Komma gehört.","Der|Schüler|*der|zu|spät|kam|*entschuldigte|sich.","Der Relativsatz ist eingeschoben.","Der Schüler, der zu spät kam, entschuldigte sich."),
    MC(3,"Welcher Satz ist richtig?",["Obwohl die Mehrheit dafür war, wurde der Antrag, den die Klasse 10d gestellt hatte, abgelehnt.","Obwohl die Mehrheit dafür war wurde der Antrag, den die Klasse 10d gestellt hatte, abgelehnt.","Obwohl die Mehrheit dafür war, wurde der Antrag den die Klasse 10d gestellt hatte, abgelehnt.","Obwohl, die Mehrheit dafür war, wurde der Antrag, den die Klasse 10d gestellt hatte abgelehnt."],"Jeder Nebensatz wird vollständig abgetrennt.","Drei Kommas: nach dem Nebensatz vorn, vor und nach dem eingeschobenen Relativsatz."),
    FR(3,"Verbinde zu einem Satz mit eingeschobenem Relativsatz: „Die Schulleitung hat die Pausenregel geändert. Die Regel galt seit Jahren.“","Die Schulleitung hat die Pausenregel, die seit Jahren galt, geändert.","Der Relativsatz steht direkt hinter „Pausenregel“ und wird von zwei Kommas eingeschlossen.")]),
   KAP(8,"dass und das","Ich kann dass und das sicher unterscheiden.","2026-12-01")]),
  SEC("Eine Argumentation schreiben",[
   KAP(9,"Adressat, Textform und Anlass","Ich kann aus der Aufgabenstellung Textform, Adressat und Anlass bestimmen und meinen Text darauf ausrichten.","2026-12-04"),
   KAP(10,"Aufbau einer Argumentation","Ich kenne den Aufbau einer materialgestützten Argumentation.","2026-12-08"),
   KAP(11,"Eine Argumentation planen, schreiben und überarbeiten","Ich kann eine Argumentation planen, schreiben und überarbeiten.","2026-12-11"),
   KAP(12,"Prüfungsaufgabe","Ich kann eine vollständige Prüfungsaufgabe bearbeiten.","2026-12-15")])]},
  {id:"10d-a1",titel:"A1: Sachtexte und Sprachgebrauch",ziel:"Ich kann komplexe Texte verstehen, sprachliche Strukturen sicher anwenden und Grammatik, Zeichensetzung und Rechtschreibung korrekt nutzen.",prefix:"A1",past:"Klassenarbeit am 13.11. geschrieben",sections:[
  SEC("Wortebene: Wortarten",[
   KAP(7,"Wortarten","Ich kenne die verschiedenen Wortarten und kann Wörter ihrer Wortart zuordnen.","2026-11-10",[
    SO(1,"Flektierbar oder nicht flektierbar?",["flektierbar","nicht flektierbar"],[["Haus",0],["laufen",0],["schön",0],["unter",1],["heute",1],["und",1],["ihr",0],["sehr",1]],"Flektierbar = das Wort kann seine Form ändern.","Nomen, Verben, Adjektive, Pronomen sind flektierbar. Präpositionen, Adverbien, Konjunktionen nicht."),
    MC(1,"Welche Wortart ist „wegen“?",["Präposition","Adverb","Konjunktion","Adjektiv"],"„wegen des Regens“ – es fordert einen Kasus.","„wegen“ ist eine Präposition (mit Genitiv)."),
    TF(1,"Adverbien kann man nicht deklinieren.",true,"heute, hier, sehr …","Richtig. Adverbien sind nicht flektierbar."),
    MC(1,"Was wird konjugiert?",["Verben","Nomen","Präpositionen","Adverbien"],"ich gehe, du gehst …","Konjugieren = Verben nach Person, Zahl, Zeit usw. verändern."),
    SO(2,"Ordne die Wörter zu.",["Nomen","Verb","Adjektiv","Pronomen","Präposition"],[["Freiheit",0],["diskutieren",1],["ehrlich",2],["sie",3],["trotz",4],["Lehrerin",0],["uns",3]],"Pronomen stehen für ein Nomen.","Nomen: Freiheit, Lehrerin. Verb: diskutieren. Adjektiv: ehrlich. Pronomen: sie, uns. Präposition: trotz."),
    MC(2,"Welche Wortart sind „weil“, „dass“ und „obwohl“?",["Konjunktionen","Präpositionen","Adverbien","Pronomen"],"Sie leiten Nebensätze ein.","Unterordnende Konjunktionen (auch Subjunktionen genannt)."),
    MC(2,"Was verändert sich bei der Deklination?",["Kasus, Numerus und Genus","Person und Zeit","nur die Großschreibung","gar nichts"],"der Hund, des Hundes, die Hunde …","Deklination: Kasus (Fall), Numerus (Zahl), Genus (Geschlecht)."),
    MK(3,"Tippe alle Adverbien an.","*Heute|regnet|es|*sehr|stark.","„stark“ kann man steigern (stärker). Ist das ein Adverb?","„Heute“ und „sehr“ sind Adverbien. „stark“ ist ein Adjektiv (stark – stärker – am stärksten), auch wenn es hier das Verb näher beschreibt."),
    MC(3,"„Das Lesen macht Spaß.“ Welche Wortart ist „Lesen“?",["Nomen (nominalisiertes Verb)","Verb","Adjektiv","Adverb"],"Achte auf den Artikel davor.","Mit Artikel wird das Verb zum Nomen: das Lesen."),
    MC(3,"„Er kommt morgen.“ Welche Wortart ist „morgen“?",["Adverb","Nomen","Adjektiv","Präposition"],"Klein geschrieben, unveränderlich, sagt „wann“.","„morgen“ ist hier ein Adverb. Aber: „am Morgen“ – dann ist „Morgen“ ein Nomen."),
    FR(3,"Erkläre den Unterschied zwischen flektierbaren und nicht flektierbaren Wortarten. Nenne je zwei Beispiele.","Flektierbare Wörter verändern ihre Form im Satz, z. B. Verben (gehen – ging) und Nomen (Haus – Häuser). Nicht flektierbare Wörter behalten immer dieselbe Form, z. B. Präpositionen (auf) und Adverbien (heute).","Verändert sich das Wort im Satz?")])])]}]}
]}

const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic=(n,cls)=>`<svg class="ic ${cls||""}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=iso(new Date());
const dayDiff=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const fmt=s=>{const d=new Date(s+"T12:00:00");return `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`};
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const shuffleNot=(a,same)=>{if(a.length<2)return a.slice();let b;let n=0;do{b=shuffle(a);n++}while(same(b)&&n<20);return b};
const live=t=>{const l=$("#live");l.textContent="";setTimeout(()=>l.textContent=t,30)};
const LV=["","Grundlagen","Üben","Knobeln"];
const starsTxt=n=>"★".repeat(n);

/* Struktur: Klasse → Fach → Einheit (wie Checkliste) → Abschnitt → Kapitel mit Übungen */
for(const K of DATA)for(const F of K.faecher)for(const U of F.units)for(const S of U.sections)for(const C of S.kap){C.id=U.id+"-"+C.nr;C.U=U;C.F=F;C.K=K}
const findK=k=>DATA.find(x=>x.id===k);
const findF=(k,f)=>{const K=findK(k);return K&&K.faecher.find(x=>x.id===f)};
const chapsOf=U=>U.sections.flatMap(S=>S.kap);
function findC(id){for(const K of DATA)for(const F of K.faecher)for(const U of F.units)for(const C of chapsOf(U))if(C.id===id)return C;return null}
function findU(id){for(const K of DATA)for(const F of K.faecher)for(const U of F.units)if(U.id===id)return {K,F,U};return null}
const curUnit=F=>F.units.find(U=>!U.past)||F.units[0];
const chapLabel=C=>`${C.U.prefix?C.U.prefix+" ":"Kapitel "}${C.nr}`;
const chapStatus=d=>{const x=dayDiff(TODAY,d);return x<0?"behandelt":x===0?"heute":x<=7?"nächste Woche":"später"};
function kaInfo(U){if(!U.ka||!U.ka.d)return null;const x=dayDiff(TODAY,U.ka.d);return {x,soon:x>=0&&x<=14,past:x<0}}
const lvTasks=(C,lv)=>C.tasks.map((t,i)=>({t,i})).filter(o=>o.t.lv===lv);
function lvStar(C,lv){const n=lvTasks(C,lv).length;if(!n)return false;const b=st.best[C.id+"-"+lv];return b!=null&&b>=Math.ceil(n*2*0.7)}
const lvBest=(C,lv)=>st.best[C.id+"-"+lv];
const chapDone=C=>C.tasks.length>0&&[1,2,3].every(l=>!lvTasks(C,l).length||lvBest(C,l)!=null);
const chapStars=C=>[1,2,3].filter(l=>lvStar(C,l)).length;
function chapProg(C){const p=st.pts[C.id]||{};return C.tasks.length?Object.keys(p).length/C.tasks.length:0}
function unitProg(U){const cs=chapsOf(U).filter(C=>C.tasks.length);const t=cs.reduce((a,C)=>a+C.tasks.length,0);const d=cs.reduce((a,C)=>a+Object.keys(st.pts[C.id]||{}).length,0);return t?d/t:0}
function streak(){const s=new Set(st.days);let d=new Date();if(!s.has(iso(d))){d.setDate(d.getDate()-1);if(!s.has(iso(d)))return 0}let n=0;while(s.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function ring(frac,size){const r=16,c=2*Math.PI*r;return `<svg class="ring" width="${size||46}" height="${size||46}" viewBox="0 0 40 40" aria-hidden="true"><circle class="bgc" cx="20" cy="20" r="${r}"/><circle class="fgc" cx="20" cy="20" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-frac)}" transform="rotate(-90 20 20)"/></svg>`}

/* ================= KARTEN-NUMMERN =================
   Jede Karte hat eine 4-stellige Nummer. Sie entsteht auf dem Gerät des Kindes und enthält nichts über das Kind.
   Herr Zell gibt sie im Lehrerbereich ein und sieht, ob sie schon einmal eingelöst wurde.
   LEHRER_PIN vor dem Hochladen ändern. */
const SECRET="zell-uebung-2026";
const LEHRER_PIN="2611";
const fnv=s=>{let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)>>>0}return x};
if(!st.salt){st.salt=Math.random().toString(36).slice(2,10);save()}
const cardNo=(id,d)=>String(fnv(SECRET+"|"+st.salt+"|"+id+"|"+d)%9000+1000);
function updateDone(){const fresh=[];for(const K of DATA)for(const F of K.faecher)for(const U of F.units){const cs=chapsOf(U);for(const C of cs)if(chapDone(C)&&!st.done[C.id]){st.done[C.id]=TODAY;fresh.push(C.id)}
 const uid="u:"+U.id;if(cs.every(chapDone)&&!st.done[uid]){st.done[uid]=TODAY;fresh.push(uid)}}if(fresh.length)save();return fresh}
function cardInfo(id){if(id.startsWith("u:")){const o=findU(id.slice(2));return o&&{K:o.K,F:o.F,title:"Ganze Einheit: "+o.U.titel,sub:""}}const C=findC(id);return C&&{K:C.K,F:C.F,C,title:chapLabel(C)+": "+C.titel,sub:C.U.titel}}
function showCard(id,headline){const d=st.done[id];const c=cardInfo(id);if(!d||!c)return "";const dt=new Date(d+"T12:00:00");const col=id.startsWith("u:")?c.F.color:c.F.color;
 return `<section class="prize" style="--a:${col}" aria-label="Abschlusskarte"><div class="ibox">${ic("medal")}</div><p class="small" style="font-weight:650;color:var(--A)">${esc(headline||"Geschafft!")}</p>
 <h2 style="margin:4px 0 4px">${esc(c.title)}</h2><p class="small">${esc(c.K.name)} · ${esc(c.F.name)}${c.sub?" · "+esc(c.sub):""}</p>${c.C?`<p class="card-stars" aria-label="${chapStars(c.C)} von 3 Sternen">${[1,2,3].map(l=>`<svg class="ic ${l<=chapStars(c.C)?"on":""}" aria-hidden="true"><use href="#i-star"/></svg>`).join("")}</p>`:""}
 <p class="small" style="margin-top:16px">Nummer</p><p class="code">${cardNo(id,d)}</p><p class="small">${WD[dt.getDay()]} ${pad(dt.getDate())}.${pad(dt.getMonth()+1)}.${dt.getFullYear()}</p>
 <p class="howto"><strong>Mach einen Screenshot von dieser Karte und zeig ihn Herrn Zell.</strong> Beim ersten Einlösen gibt es ein Lob.</p></section>`}
function cardModal(id){const m=$("#modal");m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Abschlusskarte"><div class="sheet">${showCard(id,"Geschafft!")}<div class="actions" style="justify-content:center"><button class="btn sec" id="mc">Schließen</button></div></div></div>`;
 const close=()=>{m.innerHTML=""};$("#mc").onclick=close;m.querySelector(".modal").onclick=e=>{if(e.target.classList.contains("modal"))close()};m.querySelector(".modal").addEventListener("keydown",e=>{if(e.key==="Escape")close()});$("#mc").focus()}

/* ================= VORLESEN ================= */
const canSpeak="speechSynthesis" in window;
let speakBtn=null;
function speak(text,btn){if(!canSpeak)return;const ss=window.speechSynthesis;if(ss.speaking){ss.cancel();if(speakBtn===btn){btn.setAttribute("aria-pressed","false");speakBtn=null;return}}
 const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=.95;const v=ss.getVoices().find(v=>/^de/i.test(v.lang));if(v)u.voice=v;
 if(speakBtn)speakBtn.setAttribute("aria-pressed","false");speakBtn=btn;btn.setAttribute("aria-pressed","true");
 u.onend=u.onerror=()=>{btn.setAttribute("aria-pressed","false");if(speakBtn===btn)speakBtn=null};ss.speak(u)}
const stopSpeak=()=>{if(canSpeak)window.speechSynthesis.cancel()};


/* ================= ANSICHTEN ================= */
let lastDepth=0;
function enter(depth){app.classList.remove("enter-f","enter-b");void app.offsetWidth;app.classList.add(depth>=lastDepth?"enter-f":"enter-b");lastDepth=depth}
function setBar(backHash,label,narrow,onBack){const b=$("#bar");b.classList.toggle("narrow",!!narrow);app.classList.toggle("narrow",!!narrow);
 b.firstElementChild.innerHTML=backHash!=null?`<a class="back" href="#${backHash}" id="barback">${ic("back")}<span>${esc(label)}</span></a>`:`<span class="brand">${esc(label)}</span>`;
 if(onBack){const a=$("#barback");a.onclick=e=>{e.preventDefault();onBack()}}}
function go(h){if(location.hash==="#"+h)render();else location.hash=h}
const pbar=f=>`<div class="pbar" aria-hidden="true"><i style="width:${Math.round(f*100)}%"></i></div>`;
const taskChaps=U=>chapsOf(U).filter(C=>C.tasks.length);

function allEarned(){const out=[];for(const K of DATA)for(const F of K.faecher)for(const U of F.units){if(st.done["u:"+U.id])out.push({id:"u:"+U.id,t:"Ganze Einheit",s:U.titel,col:F.color,d:st.done["u:"+U.id],unit:true});for(const C of chapsOf(U))if(st.done[C.id])out.push({id:C.id,t:chapLabel(C)+": "+C.titel,s:K.name+" · "+F.name,col:F.color,d:st.done[C.id]})}return out.sort((a,b)=>a.d<b.d?1:-1)}
const badgeBtn=(x,i)=>`<button class="tcard st badge-t" style="--a:${x.col};--i:${i}" data-card="${esc(x.id)}"><span class="ibox">${ic("medal")}</span><span><span class="t" style="display:block">${esc(x.t)}</span><span class="s" style="display:block">${esc(x.s)} · ${fmt(x.d)}</span></span></button>`;
function albumTeaser(){const e=allEarned();const n=e.filter(x=>!x.unit).length;
 return `<p class="h-sec">Meine Auszeichnungen</p><a class="wide tinted st" style="--a:#c86f2d" href="#album"><span class="ibox">${ic("medal")}</span><span class="grow"><span class="t" style="display:block">${n?`${n} ${n===1?"Auszeichnung":"Auszeichnungen"} gesammelt`:"Noch keine Auszeichnung"}</span><span class="s">${n?"Alle ansehen und vorzeigen":"Bearbeite alle Übungen eines Kapitels – dann bekommst du deine erste."}</span></span>${ic("next","chev")}</a>
 ${e.length?`<div class="grid" style="margin-top:8px">${e.slice(0,4).map(badgeBtn).join("")}</div>`:""}`}
function vAlbum(){setBar("start","Start");enter(1);app.style.setProperty("--a","#c86f2d");
 const e=allEarned();const chaps=e.filter(x=>!x.unit).length;let stars=0,total=0;const blocks=[];
 for(const K of DATA)for(const F of K.faecher){const cs=F.units.flatMap(taskChaps);total+=cs.length;cs.forEach(C=>stars+=chapStars(C));const active=cs.some(C=>st.pts[C.id]);if(!active)continue;
  const units=[curUnit(F),...F.units.filter(U=>U!==curUnit(F))];
  blocks.push(`<p class="h-sec" style="margin-top:32px;color:var(--ink)">${esc(K.name)} · ${esc(F.name)}</p>`+units.map(U=>{const us=taskChaps(U);if(!us.length)return "";return `<p class="h-sec" style="margin-top:12px">${esc(U.titel)} · ${us.filter(C=>st.done[C.id]).length} von ${us.length}</p><div class="grid">${us.map((C,i)=>st.done[C.id]?`<button class="tcard st badge-t" style="--a:${F.color};--i:${i}" data-card="${C.id}"><span class="ibox">${ic("medal")}</span>${chapStars(C)?`<span class="pill pillr">${ic("star")}${chapStars(C)}</span>`:""}<span><span class="t" style="display:block">${esc(chapLabel(C))}</span><span class="s" style="display:block">${esc(C.titel)} · ${fmt(st.done[C.id])}</span></span></button>`:`<a class="tcard st locked" style="--a:${F.color};--i:${i}" href="#c-${C.id}"><span class="ibox">${ic("lock")}</span><span><span class="t" style="display:block">${esc(chapLabel(C))}</span><span class="s" style="display:block">${esc(C.titel)} · noch offen</span></span></a>`).join("")}</div>`}).join(""))}
 app.innerHTML=`<p class="eyebrow">Deine Sammlung</p><h1>Meine Auszeichnungen</h1><p class="sub">Für jedes Kapitel, in dem du alle Übungen bearbeitet hast, bekommst du eine Auszeichnung. Zeig sie Herrn Zell – beim ersten Einlösen gibt es ein Lob.</p>
 <div class="tile tint st" style="margin-top:16px"><div class="stats"><div><p class="big">${chaps}</p><p class="small">${chaps===1?"Auszeichnung":"Auszeichnungen"}</p></div><div><p class="big">${stars}</p><p class="small">Sterne</p></div><div><p class="big">${e.filter(x=>x.unit).length}</p><p class="small">ganze Einheiten</p></div></div></div>
 ${e.some(x=>x.unit)?`<p class="h-sec">Ganze Einheiten</p><div class="grid">${e.filter(x=>x.unit).map(badgeBtn).join("")}</div>`:""}
 ${blocks.length?blocks.join(""):`<div class="tile sub" style="margin-top:16px">Hier sammeln sich deine Auszeichnungen. Fang einfach mit einem Kapitel an!</div>`}`;
 app.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>cardModal(b.dataset.card))}

function vHome(){setBar(null,"Übungsseite");enter(0);app.style.removeProperty("--a");const s=streak();const L=st.last?findC(st.last):null;
 app.innerHTML=`<p class="eyebrow" style="color:var(--ink-2)">Herr Zell</p><h1>Üben</h1><p class="sub">Wähle deine Klasse und übe, was ihr gerade im Unterricht macht.</p>
 <div class="tile note st" style="margin-top:16px">${ic("shield")}<div><p style="font-weight:600">Es wird nichts über dich gespeichert oder verschickt. Dein Fortschritt bleibt nur auf diesem Gerät.</p><button class="btn sec" id="del" style="margin-top:12px">${ic("trash")}Fortschritt auf diesem Gerät löschen</button></div></div>
 ${L||s?`<div class="stack" style="margin-top:8px">
 ${L?`<a class="wide tinted st" style="--a:${L.F.color};--i:1" href="#c-${L.id}"><span class="ibox">${ic("play")}</span><span class="grow"><span class="t" style="display:block">Weiter, wo du warst</span><span class="s">${esc(L.K.name)} · ${esc(chapLabel(L))}: ${esc(L.titel)}</span></span>${ic("next","chev")}</a>`:""}
 ${s?`<div class="wide st" style="--a:#c86f2d;--i:2"><span class="ibox">${ic("flame")}</span><span class="grow"><span class="t" style="display:block">${s} ${s===1?"Tag":"Tage am Stück"} geübt</span><span class="s">Bleib dran!</span></span></div>`:""}</div>`:""}
 <p class="h-sec">Klassen</p>
 <div class="grid">${DATA.map((K,i)=>{const us=K.faecher.map(curUnit);const t=us.reduce((a,U)=>a+taskChaps(U).length,0),d=us.reduce((a,U)=>a+taskChaps(U).filter(chapDone).length,0);return `<a class="tcard st" style="--a:${K.color};--i:${i}" href="#k-${K.id}"><span class="ibox">${ic("class")}</span>${d?`<span class="pill pillr">${ic("star")}${d}/${t}</span>`:""}<span><span class="t" style="display:block">${esc(K.name)}</span><span class="s" style="display:block">${K.faecher.map(f=>esc(f.name)).join(", ")}</span></span></a>`}).join("")}</div>
 ${albumTeaser()}`;
 $("#del").onclick=askDelete;app.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>cardModal(b.dataset.card))}

function vKlasse(k){const K=findK(k);if(!K)return vHome();setBar("start","Start");enter(1);app.style.setProperty("--a",K.color);
 app.innerHTML=`<p class="eyebrow">${esc(K.name)}</p><h1>Deine Fächer</h1>
 <div class="grid" style="margin-top:16px">${K.faecher.map((F,i)=>{const U=curUnit(F);const cs=taskChaps(U);const d=cs.filter(chapDone).length;return `<a class="tcard st" style="--a:${F.color};--i:${i}" href="#f-${K.id}-${F.id}"><span class="ibox">${ic(F.icon)}</span><span class="pill pillr">${ic("star")}${d}/${cs.length}</span><span><span class="t" style="display:block">${esc(F.name)}</span><span class="s" style="display:block;margin-bottom:8px">${esc(U.titel)}</span>${pbar(unitProg(U))}</span></a>`}).join("")}</div>`}

const selLv={};
function defaultLv(C){return selLv[C.id]||[1,2,3].find(l=>lvTasks(C,l).length&&!lvStar(C,l))||1}
function lvInfo(C,lv){const n=lvTasks(C,lv).length;const b=lvBest(C,lv);const need=Math.ceil(n*2*0.7);
 return lvStar(C,lv)?`Stern geschafft · bestes Ergebnis ${b} von ${n*2}`:`${n} ${n===1?"Aufgabe":"Aufgaben"} · Stern ab ${need} Punkten${b!=null?` · bisher ${b}`:""}`}
const STATUS_CLS={"behandelt":"","heute":"now","nächste Woche":"acc-p","später":""};
function chapTile(C,past,i){const s=chapStatus(C.d);const done=chapDone(C);const has=C.tasks.length>0;
 if(!has)return `<article class="kap later st" style="--i:${i}" id="k-${C.id}"><div class="khead"><span class="check" aria-hidden="true"></span><div class="grow"><p class="knr">${esc(chapLabel(C))}</p><h3 class="ktitle">${esc(C.titel)}</h3><p class="small">Übungen kommen, sobald ihr im Unterricht hier seid.</p></div>${past?"":`<span class="pill">${s}</span>`}</div></article>`;
 const lv=defaultLv(C);const started=[1,2,3].some(l=>lvBest(C,l)!=null);const r=st.refl[C.id];
 return `<article class="kap st" style="--i:${i}" id="k-${C.id}"><div class="khead"><span class="check ${done?"on":""}" role="img" aria-label="${done?"Kapitel bearbeitet, Auszeichnung erhalten":"noch offen"}">${ic("check")}</span><div class="grow"><p class="knr">${esc(chapLabel(C))}</p><h3 class="ktitle">${esc(C.titel)}</h3><p class="goal">${ic("flag")}<span>${esc(C.ziel)}</span></p></div>${past?"":`<span class="pill ${STATUS_CLS[s]}">${s}</span>`}</div>
 <div class="kbody"><p class="small" style="font-weight:600">${[1,2,3].filter(l=>lvTasks(C,l).length).length} Übungen · ${[1,2,3].filter(l=>lvTasks(C,l).length&&lvBest(C,l)!=null).length} bearbeitet · ${chapStars(C)} ${chapStars(C)===1?"Stern":"Sterne"}</p>
 <div class="ex-list">${[1,2,3].filter(l=>lvTasks(C,l).length).map(l=>{const ok=lvStar(C,l);const n=lvTasks(C,l).length;const bst=lvBest(C,l);return `<button class="ex ${ok?"ok":""}" data-go="${C.id}" data-lv="${l}"><span class="ex-st" aria-hidden="true">${"★".repeat(l)}</span><span class="grow"><span class="ex-t">Übung ${l}: ${LV[l]}</span><span class="ex-s">${ok?`Stern geschafft · ${bst} von ${n*2} Punkten`:`${n} ${n===1?"Aufgabe":"Aufgaben"}${bst!=null?` · bisher ${bst} von ${n*2} Punkten`:""}`}</span></span>${ok?`<span class="ex-ok">${ic("check")}</span>`:`<span class="ex-go">${ic("next")}</span>`}</button>`}).join("")}</div>
 ${started?`<div class="refl"><span class="small">Wie war das Kapitel für dich?</span><div class="seg" role="group" aria-label="Selbsteinschätzung">${["leicht","mittel","schwer"].map(v=>`<button data-refl="${C.id}" data-v="${v}" aria-pressed="${r===v}">${v}</button>`).join("")}</div></div>`:""}
 ${done?`<div><button class="btn sec" data-card="${C.id}">${ic("medal")}Auszeichnung zeigen</button></div>`:`<p class="small">${ic("medal")} Bearbeite alle Übungen, dann bekommst du eine Auszeichnung.</p>`}</div></article>`}
function unitHtml(U,past){let i=0;
 const secs=U.sections.map(S=>{const ks=past?S.kap.filter(C=>C.tasks.length):S.kap;if(!ks.length)return "";return `<p class="h-sec">${esc(S.titel)}</p><div class="stack">${ks.map(C=>chapTile(C,past,i++)).join("")}</div>`}).join("");
 return secs}
function unitHead(U){const ka=kaInfo(U);const cs=taskChaps(U);const d=cs.filter(chapDone).length;
 return `<div class="tile tint unit st" style="margin-top:16px"><p class="goal big">${ic("flag")}<span>${esc(U.ziel)}</span></p>
 <div class="row small" style="margin-top:12px">${ic("cal")}<span>${esc(U.ka.txt)}: ${U.ka.d?`${fmt(U.ka.d)}${U.ka.geplant?" (geplant)":""}${ka&&!ka.past?` · in ${ka.x} ${ka.x===1?"Tag":"Tagen"}`:""}`:"Termin folgt"}</span>${ka&&ka.soon?`<span class="pill warn">Vorbereitung auf die ${esc(U.ka.txt)}</span>`:""}</div>
 <div style="margin-top:16px">${pbar(unitProg(U))}<p class="small" style="margin-top:8px">${d} von ${cs.length} Kapiteln bearbeitet · ${cs.reduce((a,C)=>a+chapStars(C),0)} Sterne</p></div>
 ${st.done["u:"+U.id]?`<div style="margin-top:16px">${showCard("u:"+U.id,"Ganze Einheit geschafft!")}</div>`:""}</div>`}
function vFach(k,f,focus){const K=findK(k),F=findF(k,f);if(!F)return vKlasse(k);const U=curUnit(F);const pasts=F.units.filter(x=>x!==U);
 setBar("k-"+K.id,K.name,true);enter(2);app.style.setProperty("--a",F.color);
 app.innerHTML=`<p class="eyebrow">${esc(K.name)} · ${esc(F.name)}</p><h1>${esc(U.titel)}</h1>${unitHead(U)}${unitHtml(U,false)}
 ${pasts.length?`<p class="h-sec" style="margin-top:32px">Wiederholung</p><div class="stack">${pasts.map(P=>{const cs=taskChaps(P);return `<details class="past" ${focus&&focus.U===P?"open":""}><summary><span class="ibox">${ic("redo")}</span><span><span style="display:block">${esc(P.titel)}</span><span class="small" style="font-weight:400">${esc(P.past)} · ${cs.filter(chapDone).length}/${cs.length} geschafft</span></span>${ic("next","chev")}</summary><div class="pinner">${unitHtml(P,true)}</div></details>`}).join("")}</div>`:""}`;
 app.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{const C=findC(b.dataset.sel);const lv=+b.dataset.lv;selLv[C.id]=lv;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));app.querySelector(`[data-lvname="${C.id}"]`).textContent=LV[lv];app.querySelector(`[data-lvinfo="${C.id}"]`).textContent=lvInfo(C,lv)});
 app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>startLevel(findC(b.dataset.go),+b.dataset.lv));
 app.querySelectorAll("[data-refl]").forEach(b=>b.onclick=()=>{st.refl[b.dataset.refl]=b.dataset.v;save();b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"))});
 app.querySelectorAll("[data-card]").forEach(b=>b.onclick=()=>cardModal(b.dataset.card));
 if(focus){const el=document.getElementById("k-"+focus.id);if(el){if(el.scrollIntoView)el.scrollIntoView({block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1200)}}}

/* ================= AUFGABEN ================= */
let R=null;
function startLevel(C,lv){st.last=C.id;selLv[C.id]=lv;save();R={C,lv,list:lvTasks(C,lv),i:0,pts:[]};renderTask();window.scrollTo(0,0)}
function speakText(t){const parts=[t.q];if(t.t==="mc")parts.push("Antworten: "+t.opts.join(". "));if(t.t==="mark")parts.push(t.s.split("|").map(w=>w.replace(/^\*/,"")).join(" "));if(t.t==="gap")parts.push(t.s.replace(/\{\d\}/g," Lücke "));if(t.t==="sort")parts.push(t.items.map(x=>x[0]).join(". "));if(t.t==="match")parts.push(t.pairs.map(p=>p[0]).join(". "));return parts.join(". ")}
function renderTask(){stopSpeak();const {C,lv,list,i}=R;const {t}=list[i];R.tries=0;R.done=false;
 setBar("c-"+C.id,"Zur Checkliste",true,()=>{stopSpeak();go("c-"+C.id)});enter(3);
 app.innerHTML=`<p class="eyebrow">${esc(chapLabel(C))}: ${esc(C.titel)}</p>
 <div class="tprog"><span class="small" style="font-weight:600;white-space:nowrap">${starsTxt(lv)} ${LV[lv]}</span><div class="pbar" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="${list.length}" aria-valuenow="${i}"><i style="width:${i/list.length*100}%"></i></div><span class="small" style="white-space:nowrap">${i+1} von ${list.length}</span></div>
 <section class="qtile" aria-labelledby="qq"><div class="qhead"><p class="q" id="qq">${esc(t.q)}</p>${canSpeak?`<button class="speak" id="spk" aria-pressed="false" aria-label="Aufgabe vorlesen">${ic("speak")}</button>`:""}</div><div id="body"></div><div id="fb" aria-live="polite"></div><div class="actions" id="act"></div></section>`;
 if(canSpeak)$("#spk").onclick=e=>speak(speakText(t),e.currentTarget);
 ({mc:tMC,tf:tTF,gap:tGap,match:tMatch,sort:tSort,order:tOrder,mark:tMark,free:tFree})[t.t](t);
 $("#qq").setAttribute("tabindex","-1");$("#qq").focus({preventScroll:true})}
function fb(kind,html){const ico=kind==="tip"?"bulb":kind==="ok"?"check":kind==="bad"?"x":"bulb";$("#fb").innerHTML=`<div class="fb ${kind}">${ic(ico)}<div>${html}</div></div>`}
function setActions(html){$("#act").innerHTML=html}
function checkBtn(fn){setActions(`<button class="btn" id="chk">Prüfen</button>`);$("#chk").onclick=fn}
/* Ergebnis einer Aufgabe: ok=true richtig; sonst Fehlversuch. Gibt "solve" zurück, wenn die Lösung gezeigt werden soll */
function attempt(ok,t){if(ok){finish(R.tries===0?2:1,`<p><strong>${R.tries===0?"Richtig!":"Jetzt stimmt’s!"}</strong> ${esc(t.ex||"")}</p>`,"ok");return "ok"}
 R.tries++;if(R.tries===1){fb("tip",`<p><strong>Noch nicht ganz.</strong> Tipp: ${esc(t.tip||"Lies die Aufgabe noch einmal genau.")}</p>`);live("Noch nicht ganz. Tipp angezeigt.");return "tip"}
 finish(0,`<p><strong>Hier ist die Lösung.</strong> ${esc(t.ex||"")}</p>`,"bad");return "solve"}
function finish(p,html,kind){R.done=true;R.pts[R.i]=p;const id=R.C.id,idx=R.list[R.i].i;st.pts[id]=st.pts[id]||{};st.pts[id][idx]=p;if(!st.days.includes(TODAY)){st.days.push(TODAY);st.days=st.days.slice(-60)}save();
 fb(kind,html);live(kind==="ok"?"Richtig.":"Lösung angezeigt.");const last=R.i===R.list.length-1;setActions(`<button class="btn" id="nx">${last?"Ergebnis ansehen":"Weiter"}${ic("next")}</button>`);$("#nx").onclick=()=>{if(last)showResult();else{R.i++;renderTask()}};$("#nx").focus()}

function optButtons(opts,cls){return opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}
function tMC(t){const order=shuffle(t.opts.map((o,k)=>k));$("#body").innerHTML=order.map(k=>`<button class="opt" data-k="${k}">${esc(t.opts[k])}</button>`).join("");
 $("#body").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.done)return;const k=+b.dataset.k;if(k===0){b.classList.add("good");disableAll();attempt(true,t)}else{b.classList.add("bad");b.disabled=true;const r=attempt(false,t);if(r==="solve"){$("#body").querySelector('[data-k="0"]').classList.add("good");disableAll()}}})}
function disableAll(){$("#body").querySelectorAll("button,select").forEach(b=>b.disabled=true)}
function tTF(t){$("#body").innerHTML=`<div class="tf"><button class="opt" data-v="1">Richtig</button><button class="opt" data-v="0">Falsch</button></div>`;
 $("#body").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(R.done)return;const v=b.dataset.v==="1";if(v===t.a){b.classList.add("good");disableAll();attempt(true,t)}else{b.classList.add("bad");b.disabled=true;const r=attempt(false,t);if(r==="solve"){$("#body").querySelector(`[data-v="${t.a?1:0}"]`).classList.add("good");disableAll()}}})}
function tGap(t){let html=esc(t.s);t.g.forEach((opts,gi)=>{const sel=`<select data-g="${gi}" aria-label="Lücke ${gi+1}"><option value="">– wählen –</option>${shuffle(opts.map((o,k)=>k)).map(k=>`<option value="${k}">${esc(opts[k])}</option>`).join("")}</select>`;html=html.replace(`{${gi}}`,sel)});
 $("#body").innerHTML=`<p class="gapt">${html}</p>`;const sels=[...$("#body").querySelectorAll("select")];sels.forEach(s=>s.onchange=()=>s.classList.remove("good","bad"));
 checkBtn(()=>{if(sels.some(s=>s.value==="")){fb("info","<p>Wähle zuerst in jeder Lücke ein Wort aus.</p>");return}let all=true;sels.forEach(s=>{const ok=s.value==="0";s.classList.toggle("good",ok);s.classList.toggle("bad",!ok);if(!ok)all=false});
  const r=attempt(all,t);if(r==="ok"||r==="solve"){sels.forEach(s=>{s.value="0";s.classList.remove("bad");s.classList.add("good");s.disabled=true})}})}
function tMatch(t){const L=t.pairs.map((p,k)=>k);const Rr=shuffleNot(L,b=>b.every((v,i)=>v===i));const pair={};let act=null;const locked=new Set();
 const draw=()=>{const num=k=>{const ks=Object.keys(pair).map(Number).sort((a,b)=>a-b);return ks.indexOf(k)+1};
  $("#body").innerHTML=`<p class="small" style="margin-top:-4px">Tippe links einen Begriff an, dann rechts die passende Erklärung.</p><div class="match"><div>${L.map(k=>`<button class="chip ${pair[k]!=null?"paired":""} ${locked.has(k)?"good":""}" data-l="${k}" aria-pressed="${act===k}">${pair[k]!=null?`<span class="n">${num(k)}</span>`:""}<span>${esc(t.pairs[k][0])}</span></button>`).join("")}</div><div>${Rr.map(r=>{const lk=Object.keys(pair).find(k=>pair[k]===r);return `<button class="chip ${lk!=null?"paired":""} ${lk!=null&&locked.has(+lk)?"good":""}" data-r="${r}">${lk!=null?`<span class="n">${num(+lk)}</span>`:""}<span>${esc(t.pairs[r][1])}</span></button>`}).join("")}</div></div>`;
  $("#body").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{if(R.done)return;const k=+b.dataset.l;if(locked.has(k))return;if(pair[k]!=null){delete pair[k];act=k}else act=act===k?null:k;draw();const nb=$(`#body [data-l="${k}"]`);if(nb)nb.focus()});
  $("#body").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(R.done)return;const r=+b.dataset.r;const lk=Object.keys(pair).find(k=>pair[k]===r);if(lk!=null){if(locked.has(+lk))return;delete pair[lk]}if(act==null){fb("info","<p>Tippe zuerst links einen Begriff an.</p>");draw();return}pair[act]=r;act=null;draw();const nb=$(`#body [data-r="${r}"]`);if(nb)nb.focus()});
  if(R.done)disableAll()};
 draw();checkBtn(()=>{if(Object.keys(pair).length<L.length){fb("info","<p>Verbinde zuerst alle Paare.</p>");return}const wrong=L.filter(k=>pair[k]!==k);L.forEach(k=>{if(pair[k]===k)locked.add(k)});
  if(!wrong.length){draw();attempt(true,t);return}wrong.forEach(k=>delete pair[k]);const r=attempt(false,t);if(r==="solve"){L.forEach(k=>{pair[k]=k;locked.add(k)})}draw()})}
function tSort(t){const order=shuffle(t.items.map((x,k)=>k));const ch={};
 $("#body").innerHTML=order.map(k=>`<div class="srow" data-row="${k}"><div>${esc(t.items[k][0])}</div><div class="seg" role="group" aria-label="Kategorie wählen">${t.cats.map((c,ci)=>`<button data-k="${k}" data-c="${ci}" aria-pressed="false">${esc(c)}</button>`).join("")}</div></div>`).join("");
 $("#body").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{if(R.done)return;const k=+b.dataset.k;ch[k]=+b.dataset.c;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));b.closest(".srow").classList.remove("bad")});
 checkBtn(()=>{if(Object.keys(ch).length<t.items.length){fb("info","<p>Ordne zuerst alle Kärtchen zu.</p>");return}let all=true;t.items.forEach((x,k)=>{const row=$(`#body [data-row="${k}"]`);const ok=ch[k]===x[1];row.classList.toggle("good",ok);row.classList.toggle("bad",!ok);if(!ok)all=false});
  const r=attempt(all,t);if(r==="solve"){t.items.forEach((x,k)=>{const row=$(`#body [data-row="${k}"]`);row.classList.remove("bad");row.classList.add("good");row.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.c===x[1]?"true":"false"))})}if(r!=="tip")disableAll()})}
function tOrder(t){const idx=t.items.map((x,k)=>k);let pool=shuffleNot(idx,b=>b.every((v,i)=>v===i));let ans=[];let marks=null;
 const draw=()=>{$("#body").innerHTML=`<p class="small" style="margin-top:-4px">Tippe die Teile der Reihe nach an. Antippen in der Antwort nimmt einen Teil wieder heraus.</p><div class="ans" aria-label="Deine Reihenfolge">${ans.length?ans.map((k,p)=>`<button class="ochip ${marks?(marks[p]?"good":"bad"):""}" data-a="${p}">${p+1}. ${esc(t.items[k])}</button>`).join(""):`<span class="ph">Noch leer</span>`}</div><div class="pool">${pool.map(k=>`<button class="ochip" data-p="${k}">${esc(t.items[k])}</button>`).join("")}</div>`;
  $("#body").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{if(R.done)return;const k=+b.dataset.p;pool=pool.filter(x=>x!==k);ans.push(k);marks=null;draw();const nb=$("#body [data-p]")||$("#chk");if(nb)nb.focus()});
  $("#body").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(R.done)return;const p=+b.dataset.a;pool.push(ans[p]);ans.splice(p,1);marks=null;draw()});
  if(R.done)disableAll()};
 draw();checkBtn(()=>{if(pool.length){fb("info","<p>Ordne zuerst alle Teile ein.</p>");return}marks=ans.map((k,p)=>k===p);const all=marks.every(Boolean);const r=attempt(all,t);if(r==="solve"){ans=idx.slice();marks=ans.map(()=>true)}draw()})}
function tMark(t){const toks=t.s.split("|").map(w=>({w:w.replace(/^\*/,""),c:w.startsWith("*")}));const sel=new Set();
 $("#body").innerHTML=`<p class="sent">${toks.map((x,k)=>`<button class="tok" data-k="${k}" aria-pressed="false">${esc(x.w)}</button>`).join(" ")}</p>`;
 $("#body").querySelectorAll(".tok").forEach(b=>b.onclick=()=>{if(R.done)return;const k=+b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute("aria-pressed",sel.has(k)?"true":"false");b.classList.remove("bad")});
 checkBtn(()=>{if(!sel.size){fb("info","<p>Tippe zuerst mindestens ein Wort an.</p>");return}const ok=toks.every((x,k)=>x.c===sel.has(k));const r=attempt(ok,t);
  if(r==="ok"||r==="solve"){$("#body").querySelectorAll(".tok").forEach(b=>{const k=+b.dataset.k;b.setAttribute("aria-pressed","false");if(toks[k].c)b.classList.add("good");else if(sel.has(k))b.classList.add("bad")});disableAll()}})}
function tFree(t){$("#body").innerHTML=`<label class="sr" for="ta">Deine Antwort</label><textarea id="ta" placeholder="Schreibe hier deine Antwort …"></textarea><p class="small" style="margin:8px 0 0">Deine Antwort bleibt nur hier auf dem Bildschirm. Sie wird nicht gespeichert.</p>`;
 setActions(`<button class="btn sec" id="tp">${ic("bulb")}Tipp</button><button class="btn" id="ml">Mit Musterlösung vergleichen</button>`);
 $("#tp").onclick=()=>fb("tip",`<p>Tipp: ${esc(t.tip||"")}</p>`);
 $("#ml").onclick=()=>{const v=$("#ta").value.trim();if(v.length<10){fb("info","<p>Schreibe zuerst eine eigene Antwort – mindestens einen Satz.</p>");return}
  $("#ta").readOnly=true;fb("info",`<p><strong>Musterlösung</strong></p><p class="model">${esc(t.model)}</p><p style="margin-top:10px"><strong>Vergleiche ehrlich: Wie nah warst du dran?</strong></p>`);
  setActions(`<button class="btn" data-s="2">${ic("check")}Passt</button><button class="btn sec" data-s="1">Teilweise</button><button class="btn sec" data-s="0">Noch nicht</button>`);
  $("#act").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const p=+b.dataset.s;R.done=true;R.pts[R.i]=p;const id=R.C.id,idx=R.list[R.i].i;st.pts[id]=st.pts[id]||{};st.pts[id][idx]=p;if(!st.days.includes(TODAY))st.days.push(TODAY);save();
   const last=R.i===R.list.length-1;setActions(`<button class="btn" id="nx">${last?"Ergebnis ansehen":"Weiter"}${ic("next")}</button>`);$("#nx").onclick=()=>{if(last)showResult();else{R.i++;renderTask()}};$("#nx").focus()})};}


/* ================= ERGEBNIS ================= */
function showResult(){stopSpeak();const {C,lv,list}=R;const sum=R.pts.reduce((a,b)=>a+(b||0),0),max=list.length*2;const key=C.id+"-"+lv;if(st.best[key]==null||sum>st.best[key])st.best[key]=sum;save();const fresh=updateDone();const unitFresh=fresh.find(x=>x.startsWith("u:"));
 const star=lvStar(C,lv);const now=new Date();const dt=`${pad(now.getDate())}.${pad(now.getMonth()+1)}.${now.getFullYear()}`;
 const nextLv=[lv+1,lv+2].find(l=>l<=3&&lvTasks(C,l).length);
 const r=34,c=2*Math.PI*r,frac=max?sum/max:0;
 setBar("c-"+C.id,"Zur Checkliste",true);enter(4);
 app.innerHTML=`<p class="eyebrow">${esc(chapLabel(C))} · ${starsTxt(lv)} ${LV[lv]}</p>
 <section class="tile result" aria-labelledby="rh">
 <svg class="done-ring" width="96" height="96" viewBox="0 0 80 80" aria-hidden="true"><circle class="bg" cx="40" cy="40" r="${r}"/><circle class="fg" cx="40" cy="40" r="${r}" style="--c:${c}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-frac)}"/>${star?`<path class="ck" d="M27 41l9 9 17-18"/>`:""}</svg>
 <h1 id="rh" style="margin:0">${sum===max?"Alles richtig!":star?"Stufe geschafft!":"Gut geübt!"}</h1>
 <p class="big" style="margin-top:8px">${sum} / ${max}</p><p class="small">Punkte</p>
 <dl class="rgrid"><dt>Klasse</dt><dd>${esc(C.K.name)} · ${esc(C.F.name)}</dd><dt>Kapitel</dt><dd>${esc(chapLabel(C))}: ${esc(C.titel)}</dd><dt>Stufe</dt><dd>${starsTxt(lv)} ${LV[lv]}</dd><dt>Datum</dt><dd>${dt}</dd></dl>
 ${star?"":`<p class="small" style="margin-top:16px">Ab ${Math.ceil(max*0.7)} Punkten bekommst du den Stern für diese Stufe.</p>`}</section>
 ${fresh.includes(C.id)?`<div style="margin-top:12px">${showCard(C.id,"Neue Auszeichnung!")}</div>`:""}
 ${unitFresh?`<div style="margin-top:12px">${showCard(unitFresh,"Ganze Einheit geschafft")}</div>`:""}
 <div class="actions">${nextLv?`<button class="btn" id="nl">Weiter mit ${starsTxt(nextLv)} ${LV[nextLv]}${ic("next")}</button>`:""}<button class="btn sec" id="ag">${ic("redo")}Nochmal</button><a class="btn sec" href="#c-${C.id}">Zur Checkliste</a>${fresh.length?`<a class="btn sec" href="#album">${ic("medal")}Meine Auszeichnungen</a>`:""}</div>`;
 if($("#nl"))$("#nl").onclick=()=>startLevel(C,nextLv);$("#ag").onclick=()=>startLevel(C,lv);
 $("#rh").setAttribute("tabindex","-1");$("#rh").focus({preventScroll:true});window.scrollTo(0,0)}

/* ================= LÖSCHEN ================= */
function askDelete(){const m=$("#modal");m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="sheet"><h2 id="mh" style="margin-top:0">Fortschritt löschen?</h2><p>Alle Punkte, Sterne, Abzeichen und deine Serie auf diesem Gerät werden gelöscht. Danach kannst du neu anfangen.</p><div class="actions"><button class="btn" id="my">${ic("trash")}Ja, löschen</button><button class="btn sec" id="mn">Abbrechen</button></div></div></div>`;
 $("#mn").onclick=()=>{m.innerHTML="";$("#del").focus()};$("#my").onclick=()=>{st={pts:{},best:{},last:null,days:[],done:{},refl:{},salt:Math.random().toString(36).slice(2,10)};try{localStorage.removeItem(KEY)}catch(e){}save();m.innerHTML="";render();live("Fortschritt gelöscht.")};
 m.querySelector(".modal").addEventListener("keydown",e=>{if(e.key==="Escape")$("#mn").click()});$("#mn").focus()}

/* ================= LEHRKRAFT =================
   Eingelöste Nummern werden nur auf dem Gerät der Lehrkraft gespeichert. */
const TKEY="uebung-zell-lehrer-v1";
let used=[];try{used=JSON.parse(localStorage.getItem(TKEY)||"[]")||[]}catch(e){used=[]}
const saveUsed=()=>{try{localStorage.setItem(TKEY,JSON.stringify(used))}catch(e){}};
let teacherOk=false;
function vLehrer(){if(!teacherOk){setBar("start","Start",true);enter(1);app.style.removeProperty("--a");app.innerHTML=`<p class="eyebrow" style="color:var(--ink-2)">Nur für Herrn Zell</p><h1>Lehrkraft</h1><div class="tile" style="margin-top:16px"><form id="pf" class="row"><label for="pin">PIN</label><input type="password" id="pin" inputmode="numeric" autocomplete="off"><button class="btn" type="submit">Weiter</button></form><div id="pfb" aria-live="polite"></div></div>`;
  $("#pf").onsubmit=e=>{e.preventDefault();if($("#pin").value===LEHRER_PIN){teacherOk=true;vLehrer()}else $("#pfb").innerHTML=`<div class="fb bad">${ic("x")}<p>PIN falsch.</p></div>`};$("#pin").focus();return}
 setBar("start","Start",true);app.innerHTML=`<p class="eyebrow" style="color:var(--ink-2)">Lehrkraft</p><h1>Karte einlösen</h1><p class="small">Gib die 4-stellige Nummer von der Karte ein. Eingelöste Nummern merkt sich nur dieses Gerät.</p>
 <div class="tile" style="margin-top:16px"><form id="cf" class="row"><label class="sr" for="cc">Nummer</label><input type="text" id="cc" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="0000" style="max-width:140px;font-size:22px;letter-spacing:.1em;font-variant-numeric:tabular-nums"><button class="btn" type="submit">Einlösen</button></form><div id="cfb" aria-live="polite"></div></div>
 <p class="h-sec">Zuletzt eingelöst (${used.length})</p>${used.length?`<div class="stack">${used.slice().reverse().slice(0,30).map(u=>`<div class="used"><strong>${esc(u.c)}</strong><span class="small">${fmt(u.d)} ${u.d.slice(0,4)}</span></div>`).join("")}</div><div class="actions"><button class="btn sec" id="clr">${ic("trash")}Liste löschen</button></div>`:`<p class="small">Noch keine.</p>`}`;
 const inp=$("#cc");inp.focus();
 $("#cf").onsubmit=e=>{e.preventDefault();const c=inp.value.replace(/\D/g,"");const o=$("#cfb");
  if(!/^[1-9]\d{3}$/.test(c)){o.innerHTML=`<div class="fb bad">${ic("x")}<p>Bitte eine 4-stellige Nummer eingeben.</p></div>`;return}
  const u=used.find(x=>x.c===c);
  if(u){o.innerHTML=`<div class="fb bad">${ic("x")}<p><strong>Schon eingelöst</strong> am ${fmt(u.d)} ${u.d.slice(0,4)}. Kein neues Lob.</p></div>`;return}
  used.push({c,d:TODAY});saveUsed();vLehrer();$("#cfb").innerHTML=`<div class="fb ok">${ic("check")}<p><strong>Neu – ${esc(c)} ist jetzt eingelöst.</strong> Lob in Untis eintragen.</p><button class="btn sec" id="undo" style="margin-left:auto">Rückgängig</button></div>`;
  $("#undo").onclick=()=>{used=used.filter(x=>x.c!==c);saveUsed();vLehrer()}};
 if($("#clr"))$("#clr").onclick=()=>{const m=$("#modal");m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh2"><div class="sheet"><h2 id="mh2" style="margin-top:0">Liste löschen?</h2><p>Danach werden alte Nummern wieder als neu erkannt.</p><div class="actions"><button class="btn" id="my2">Ja, löschen</button><button class="btn sec" id="mn2">Abbrechen</button></div></div></div>`;
  $("#mn2").onclick=()=>m.innerHTML="";$("#my2").onclick=()=>{used=[];saveUsed();m.innerHTML="";vLehrer()};$("#mn2").focus()}}

/* ================= ROUTER ================= */
function render(){stopSpeak();R=null;const h=location.hash.slice(1);let m;let focus=null;
 if((m=h.match(/^k-(\w+)$/)))vKlasse(m[1]);
 else if((m=h.match(/^f-(\w+)-(\w+)$/)))vFach(m[1],m[2]);
 else if((m=h.match(/^c-([\w-]+)$/))&&(focus=findC(m[1]))){const C=focus;window.scrollTo(0,0);vFach(C.K.id,C.F.id,C);return}
 else if(h==="lehrer")vLehrer();
 else if(h==="album")vAlbum();
 else vHome();
 window.scrollTo(0,0)}
window.addEventListener("hashchange",render);
render();
}
</script>
</body>
