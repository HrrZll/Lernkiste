<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Übungsseite Herr Zell</title>
<style>
/* Stil wie die Schulapp: ruhig, Flächen statt Linien, Systemschrift, Lucide-Linien-Icons.
   Abstände 4/8/12/16/24/32 · Radius 14 Kacheln, 12 Antworten, 10 Icon-Felder · Akzent je Klasse/Fach */
:root{--bg:#fff;--surface:#fff;--flaeche:#f5f5f3;--flaeche-hover:#efefec;--surface-2:#f1f1ef;--ink:#37352f;--ink-2:#6b6a66;--ink-3:#8a8984;--good:#1f8a53;--warn:#b06a06;--bad:#c0392f;
 --primary:#37352f;--on-primary:#fff;--seg-shadow:0 1px 2px rgba(0,0,0,.08);--a:#3f5bd9;--A:var(--a);
 --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--surface:#121212;--flaeche:#1e1e1e;--flaeche-hover:#252525;--surface-2:#262626;--ink:#ebebea;--ink-2:#b8b7b3;--ink-3:#a09f9a;--good:#5cc28d;--warn:#e0a24a;--bad:#ec7a70;--primary:#ebebea;--on-primary:#191919;--seg-shadow:none;--A:color-mix(in srgb,var(--a) 55%,#fff);color-scheme:dark}}
:root[data-theme=dark]{--bg:#121212;--surface:#121212;--flaeche:#1e1e1e;--flaeche-hover:#252525;--surface-2:#262626;--ink:#ebebea;--ink-2:#b8b7b3;--ink-3:#a09f9a;--good:#5cc28d;--warn:#e0a24a;--bad:#ec7a70;--primary:#ebebea;--on-primary:#191919;--seg-shadow:none;--A:color-mix(in srgb,var(--a) 55%,#fff);color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:clip}
*[style*="--a"],.acc{--A:var(--a)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) *[style*="--a"],:root:not([data-theme=light]) .acc{--A:color-mix(in srgb,var(--a) 55%,#fff)}}
:root[data-theme=dark] *[style*="--a"],:root[data-theme=dark] .acc{--A:color-mix(in srgb,var(--a) 55%,#fff)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--A);outline-offset:2px;border-radius:10px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Kopfleiste */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:env(safe-area-inset-top) max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
.bar-in{max-width:1100px;margin:0 auto;height:52px;display:flex;align-items:center;gap:8px}
.bar.narrow .bar-in{max-width:760px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 4px;margin-left:-4px;border-radius:10px;font-weight:600;font-size:15px;color:var(--ink)}
.back:hover{background:var(--flaeche)}
.brand{font-weight:650;font-size:15px;color:var(--ink-2)}

/* Seite */
.wrap{max-width:1100px;margin:0 auto;padding:8px max(20px,env(safe-area-inset-right)) 32px max(20px,env(safe-area-inset-left))}
.wrap.narrow{max-width:760px}
.eyebrow{font-size:13px;font-weight:650;color:var(--A);margin:8px 0 4px}
h1{font-size:27px;line-height:1.2;font-weight:700;letter-spacing:-.025em;margin:0 0 8px;text-wrap:balance}
h2{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.015em;margin:0}
.h-sec{font-size:13px;font-weight:650;color:var(--ink-2);margin:24px 0 8px}
p{margin:0}
.sub{color:var(--ink-2);font-size:15px}
.small{font-size:13px;color:var(--ink-2)}
.stack{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}

/* Kacheln */
.tile{background:var(--flaeche);border-radius:14px;padding:16px}
.tint{background:color-mix(in srgb,var(--A) 9%,var(--flaeche))}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}}
.tcard{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:110px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--A) 9%,var(--flaeche));transition:transform .15s var(--ease),background .15s}
.tcard:hover{background:color-mix(in srgb,var(--A) 13%,var(--flaeche))}
.ibox{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--A) 16%,var(--flaeche));color:var(--A);flex:none}
.tcard .t{font-size:15px;font-weight:650;line-height:1.3}
.tcard .s{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.35}
.pillr{position:absolute;top:14px;right:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill .ic{width:14px;height:14px}
.pill.acc-p{background:color-mix(in srgb,var(--A) 16%,var(--flaeche));color:var(--ink)}
.pill.now{background:var(--primary);color:var(--on-primary)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,var(--flaeche));color:var(--ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,var(--flaeche));color:var(--ink)}
.pbar{height:4px;border-radius:99px;background:color-mix(in srgb,var(--A) 14%,var(--surface-2));overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--A);transition:width .5s var(--ease)}
.wide{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--flaeche);transition:transform .15s var(--ease),background .15s}
.wide:hover{background:var(--flaeche-hover)}
.wide.tinted{background:color-mix(in srgb,var(--A) 9%,var(--flaeche))}
.wide .grow{flex:1}
.wide .t{font-size:15px;font-weight:650}
.wide .s{font-size:13px;color:var(--ink-2)}
.chev{color:var(--ink-3)}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;line-height:1.3;text-align:center;border-radius:12px;background:var(--primary);color:var(--on-primary);font-size:15px;font-weight:600;transition:transform .12s var(--ease),opacity .15s}
.btn.sec{background:var(--flaeche-hover);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn[disabled]{opacity:.4;cursor:default}
.btn .ic{width:18px;height:18px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
button:active:not([disabled]),.tcard:active,.wide:active{transform:scale(.97)}

/* Segmented control */
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface-2)}
.seg button{flex:1;min-height:40px;padding:4px 8px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:4px;transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:var(--seg-shadow)}
:root[data-theme=dark] .seg button[aria-pressed=true]{background:#3a3a38}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg button[aria-pressed=true]{background:#3a3a38}}
.seg .ok-dot{width:16px;height:16px;color:var(--good)}

/* Checkliste */
.unit{padding:16px}
.goal{display:flex;gap:8px;align-items:flex-start;color:var(--ink-2);font-size:14px;line-height:1.45}
.goal .ic{width:16px;height:16px;margin-top:2px;color:var(--A)}
.goal.big{font-size:15px;color:var(--ink)}
.kap{background:var(--flaeche);border-radius:14px;padding:16px;scroll-margin-top:72px;transition:background .6s}
.kap.flash{background:color-mix(in srgb,var(--A) 12%,var(--flaeche))}
.khead{display:flex;gap:12px;align-items:flex-start}
.knr{font-size:13px;font-weight:650;color:var(--A)}
.ktitle{font-size:16px;font-weight:650;line-height:1.35;margin:1px 0 4px}
.check{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:transparent;margin-top:2px}
.check.on{background:var(--A);color:var(--bg)}
.check .ic{width:16px;height:16px;stroke-width:2.6}
.kbody{margin-top:16px;display:grid;gap:12px}
.krow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.krow .grow{flex:1}
.kap.later{background:transparent;padding:12px 16px}
.kap.later .ktitle{color:var(--ink-2)}
.ex-list{display:grid;gap:8px}
.ex{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 14px;border-radius:12px;background:var(--surface);text-align:left;transition:background .15s,transform .12s var(--ease)}
.ex:hover{background:var(--surface-2)}
.ex-st{flex:none;width:52px;height:32px;padding:0;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--A) 14%,var(--surface));color:var(--A);font-size:13px;letter-spacing:1px}
.ex-t{display:block;font-size:15px;font-weight:650}
.ex-s{display:block;font-size:13px;color:var(--ink-2)}
.ex-go{color:var(--ink-3)}
.ex-ok{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:var(--bg)}
.ex-ok .ic{width:16px;height:16px;stroke-width:2.6}
.ex.ok{background:color-mix(in srgb,var(--good) 9%,var(--surface))}
.refl{display:grid;gap:8px}
.refl .seg{max-width:360px}
.refl .seg button{min-height:36px;font-size:13px}
details.past{border-radius:14px;background:var(--flaeche)}
details.past>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;font-weight:650}
details.past>summary::-webkit-details-marker{display:none}
details.past>summary .chev{margin-left:auto;transition:transform .2s var(--ease)}
details.past[open]>summary .chev{transform:rotate(90deg)}
details.past .pinner{padding:0 8px 8px}
details.past .kap{background:var(--bg)}
details.later{margin-top:8px}
details.later>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;font-weight:600;padding:0 4px}
details.later>summary::-webkit-details-marker{display:none}

/* Aufgaben */
.qtile{background:var(--flaeche);border-radius:14px;padding:16px}
.qhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.q{font-size:18px;line-height:1.5;font-weight:600;margin:0 0 16px}
.speak{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none}
.speak[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.opt{display:block;width:100%;text-align:left;min-height:52px;padding:14px;border-radius:12px;background:var(--surface);margin-bottom:8px;font-size:17px;line-height:1.4;transition:background .15s,transform .12s var(--ease)}
.opt:hover:not([disabled]){background:var(--surface-2)}
.opt[disabled]{cursor:default}
.good{background:color-mix(in srgb,var(--good) 14%,var(--surface))!important;color:var(--ink)!important;animation:pop .32s var(--spring)}
.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface))!important;color:var(--ink)!important;animation:shake .3s var(--ease)}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .opt{text-align:center;font-weight:600;margin:0}
.sent{font-size:18px;line-height:2.4}
.tok{display:inline-block;min-height:44px;min-width:44px;padding:6px 10px;margin:2px 0;border-radius:10px;background:var(--surface);font-size:18px;transition:background .15s,transform .12s var(--ease)}
.tok[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.gapt{font-size:18px;line-height:2.6}
select{min-height:44px;padding:6px 12px;border-radius:10px;border:0;background:var(--surface);color:var(--ink);font-size:17px;max-width:100%}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.match{grid-template-columns:1fr;gap:16px}}
.chip{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:12px;background:var(--surface);margin-bottom:8px;font-size:16px;line-height:1.35;transition:background .15s,transform .12s var(--ease)}
.chip[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.chip .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--A) 18%,var(--surface));color:var(--ink);font-weight:700;font-size:13px}
.chip.paired{background:var(--surface-2)}
.srow{background:var(--surface);border-radius:12px;padding:14px;margin-bottom:8px;font-size:17px;line-height:1.4}
.srow .seg{margin-top:12px}
.srow .seg button{font-size:14px;min-height:40px}
.ans{min-height:60px;background:var(--surface);border-radius:12px;padding:8px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans .ph{color:var(--ink-2);padding:4px 8px;font-size:15px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.ochip{min-height:44px;padding:8px 12px;border-radius:10px;background:var(--surface);text-align:left;font-size:16px;line-height:1.35}
.ans .ochip{background:var(--surface-2)}
textarea{width:100%;min-height:140px;border:0;border-radius:12px;padding:14px;background:var(--surface);font-size:17px;line-height:1.5;resize:vertical;color:var(--ink)}
input[type=text],input[type=password]{font-size:17px;min-height:44px;border:0;border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink);width:100%;max-width:240px}
.fb{border-radius:12px;padding:14px;margin-top:16px;display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;animation:fade .25s var(--ease)}
.fb .ic{margin-top:2px}
.fb.tip{background:color-mix(in srgb,var(--warn) 12%,var(--surface))}.fb.tip>.ic{color:var(--warn)}
.fb.ok{background:color-mix(in srgb,var(--good) 13%,var(--surface))}.fb.ok>.ic{color:var(--good)}
.fb.bad{background:color-mix(in srgb,var(--bad) 11%,var(--surface))}.fb.bad>.ic{color:var(--bad)}
.fb.info{background:var(--surface)}.fb.info>.ic{color:var(--ink-2)}
.model{white-space:pre-line}
.tprog{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.tprog .pbar{flex:1}

/* Ergebnis und Karte */
.result{text-align:center;padding:24px 16px}
.done-ring{display:block;margin:0 auto 12px}
.done-ring .bg{fill:none;stroke:color-mix(in srgb,var(--A) 14%,var(--surface-2));stroke-width:6}
.done-ring .fg{fill:none;stroke:var(--A);stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;animation:ringfill .9s var(--ease) both}
.done-ring .ck{fill:none;stroke:var(--A);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .75s var(--ease) forwards}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
@keyframes draw{to{stroke-dashoffset:0}}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.rgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;text-align:left;max-width:420px;margin:16px auto 0;font-size:15px}
.rgrid dt{color:var(--ink-2)}
.rgrid dd{margin:0;font-weight:600}
.prize{text-align:center;padding:24px 16px;border-radius:14px;background:color-mix(in srgb,var(--A) 9%,var(--flaeche))}
.prize .ibox{margin:0 auto 12px;width:44px;height:44px}
.prize .ibox .ic{width:22px;height:22px}
.code{font-size:40px;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums;margin:4px 0}
.howto{margin:16px auto 0;max-width:400px;font-size:15px}
.badge-t{text-align:left}
.locked{background:var(--flaeche)!important}.locked .ibox{background:var(--surface-2);color:var(--ink-3)}
.card-stars{display:flex;justify-content:center;gap:4px;margin-top:8px}.card-stars .ic{width:22px;height:22px;color:var(--ink-3)}.card-stars .ic.on{color:var(--warn);fill:currentColor}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.small .ic{width:14px;height:14px;vertical-align:-2px}

/* Hinweise, Dialog, Fuß */
.note{display:flex;gap:12px;align-items:flex-start}
.note>.ic{color:var(--good);margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:9;animation:fade .2s var(--ease)}
.modal .sheet{max-width:440px;width:100%;background:var(--bg);border-radius:14px;padding:16px}
.used{background:var(--flaeche);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
footer{max-width:1100px;margin:0 auto;padding:24px 20px calc(32px + env(safe-area-inset-bottom));color:var(--ink-2);text-align:center;font-size:12px}
footer a{display:inline-block;min-height:44px;line-height:44px;padding:0 8px;color:var(--ink-2)}

/* Bewegung */
@keyframes fade{from{opacity:0}}
@keyframes inR{from{opacity:0;transform:translateX(28px)}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}}
@keyframes up{from{opacity:0;transform:translateY(10px) scale(.98)}}
.enter-f{animation:inR .2s var(--ease)}
.enter-b{animation:inL .2s var(--ease)}
.st{animation:up .35s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

 <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>

{id:"6f",name:"Klasse 6f",color:"#3f5bd9",faecher:[
 {id:"d",name:"Deutsch",icon:"book",color:"#3f5bd9",units:[
  {id:"6f-sagen",titel:"Sagen, Nacherzählen und Zeichensetzung",ziel:"Ich kann eine Sage lesen, verstehen, sie nacherzählen und Satzzeichen korrekt anwenden.",prefix:"Sagen",ka:{d:"2026-12-18",txt:"Klassenarbeit",geplant:true},sections:[
  SEC("Sagen kennenlernen",[
   KAP(1,"Eine Sage kennenlernen","Ich kann beschreiben, was eine Sage ist.","2026-11-13",[
    MC(1,"Was ist eine Sage?",["Eine alte Geschichte, die man sich früher erzählt hat","Ein Bericht aus der Zeitung","Ein Gedicht mit Reimen","Eine Anleitung zum Basteln"],"Denk daran: Früher gab es keine Bücher für alle.","Sagen sind alte Geschichten. Die Menschen haben sie lange mündlich weitererzählt. Erst später hat man sie aufgeschrieben."),
    TF(1,"Eine Sage spielt oft an einem Ort, den es wirklich gibt.",true,"Denk an die Loreley oder an Loch Ness.","Richtig. Die Loreley ist ein Felsen am Rhein. Loch Ness ist ein See in Schottland."),
    GAP(1,"Wähle das passende Wort.","Eine Sage hat einen wahren {0}. Früher hat man Sagen {1} weitergegeben.",[["Kern","Reim","Preis"],["mündlich","per Brief","im Internet"]],"Ein Teil der Sage stimmt wirklich. Und: Wie hat man früher Geschichten weitergegeben?","Eine Sage hat einen wahren Kern. Man hat sie mündlich weitererzählt."),
    TF(2,"In einer Sage passiert nie etwas Übernatürliches.",false,"Gibt es in Sagen Ungeheuer, Riesen oder Geister?","Falsch. In Sagen kommen oft Ungeheuer, Riesen, Geister oder Zauber vor."),
    MC(2,"Woran erkennst du eher eine Sage als ein Märchen?",["Die Geschichte nennt einen echten Ort.","Sie beginnt mit „Es war einmal“.","Tiere können sprechen.","Am Ende wird alles gut."],"Märchen spielen „irgendwo“. Sagen nicht.","Märchen spielen an einem unbestimmten Ort. Sagen nennen einen echten Ort."),
    MC(2,"Warum haben sich die Menschen früher Sagen erzählt?",["Um Dinge zu erklären, die sie nicht verstanden haben","Um Werbung zu machen","Um Rechnen zu üben","Weil der König es befohlen hat"],"Stell dir vor: Ein Schiff verunglückt und keiner weiß, warum.","Sagen erklären oft seltsame Ereignisse, zum Beispiel Unglücke an einem gefährlichen Ort."),
    MK(3,"Tippe die Wörter an, die einen echten Ort nennen.","Vor|langer|Zeit|lebte|am|*Rhein|bei|*St. Goarshausen|eine|schöne|Frau.","Es sind zwei Stellen. Eine ist ein Fluss, eine ist eine Stadt.","Der Rhein ist ein Fluss. St. Goarshausen ist eine Stadt am Rhein."),
    OR(3,"Wie entsteht eine Sage? Bringe die Schritte in die richtige Reihenfolge.",["An einem Ort passiert etwas Seltsames.","Die Menschen erzählen davon.","Beim Weitererzählen wird immer mehr dazu erfunden.","Viel später schreibt jemand die Geschichte auf."],"Am Anfang steht ein echtes Ereignis. Am Ende steht das Aufschreiben.","Zuerst passiert etwas. Dann wird es weitererzählt und ausgeschmückt. Ganz am Ende wird es aufgeschrieben."),
    FR(3,"Erkläre in ein bis zwei Sätzen: Warum ist eine Sage nicht ganz erfunden?","Eine Sage hat einen wahren Kern. Den Ort gibt es wirklich, oder dort ist wirklich etwas passiert. Beim Weitererzählen wurde aber vieles dazu erfunden.","Denk an das Wort „wahrer Kern“.")]),
   KAP(2,"Das Monster von Loch Ness","Ich kenne die Sage „Das Monster von Loch Ness“.","2026-11-16",[

    FR(3,"Warum glauben manche Menschen bis heute an Nessie? Nenne einen Grund.","Der See ist sehr tief und dunkel. Man kann nicht bis zum Grund sehen. Deshalb kann man sich gut vorstellen, dass dort etwas Großes lebt. Außerdem erzählen immer wieder Menschen, sie hätten etwas gesehen.","Denk an den See selbst.")])]),

    MK(2,"Dieser Satz hat zwei Königreiche. Tippe beide Könige an.","Der|Riese|*schläft,|die|Bauern|*ernten|das|Korn.","Suche zwei Verben: Was tut der Riese? Was tun die Bauern?","„schläft“ und „ernten“ sind die beiden Könige. Also gibt es zwei Königreiche."),
    MC(2,"Wie viele Königreiche hat der Satz? „Die Ritter reiten los, weil der Drache das Dorf bedroht.“",["2","1","3","4"],"Zähle die Verben.","Zwei Verben: „reiten“ und „bedroht“. Also zwei Königreiche."),
    MC(2,"Wie viele Königreiche hat der Satz? „Am Abend singt die Frau auf dem Felsen.“",["1","2","3","0"],"Zähle die Verben.","Nur ein Verb: „singt“. Also ein Königreich."),
    MK(2,"Tippe alle Könige an.","Das|Ungeheuer|*schwimmt|im|See,|die|Fischer|*erschrecken,|ihr|Boot|*schaukelt.","Es sind drei Verben.","„schwimmt“, „erschrecken“ und „schaukelt“ sind die drei Könige."),
    MC(3,"Hier fehlt ein Komma zwischen zwei Königreichen: „Der Wind heult die Wellen schlagen gegen den Felsen.“ Wo kommt es hin?",["nach „heult“","nach „Wind“","nach „Wellen“","nach „schlagen“"],"Finde zuerst die beiden Könige. Das Komma kommt zwischen die beiden Reiche.","Der Wind heult, die Wellen schlagen gegen den Felsen. Zwei Könige: „heult“ und „schlagen“."),
    TF(3,"Stehen zwei Königreiche ohne „und“ oder „oder“ nebeneinander, trennst du sie mit einem Komma.",true,"Schau dir noch einmal den Satz mit dem Wind und den Wellen an.","Richtig. Zwischen zwei Königreichen steht ein Komma."),
    FR(3,"Schreibe einen Satz mit zwei Königreichen über eine Sage. Welche Wörter sind die Könige?","Beispiel: Die Frau singt auf dem Felsen, die Schiffer schauen nach oben.\nKönige: „singt“ und „schauen“.","Du brauchst zwei Verben und ein Komma.")]),
   KAP(4,"Hauptsatz – der König","Ich kann Hauptsätze erkennen.","2026-11-23",[
    MC(1,"Wo steht der König im Hauptsatz?",["an zweiter Stelle","ganz am Ende","immer als erstes Wort","er fehlt"],"Der Hund | bellt | laut.","Im Hauptsatz steht der König an zweiter Stelle: Der Hund | bellt | laut."),
    MK(1,"Tippe den König an.","Die|Blumen|*wachsen|schnell.","Was tun die Blumen?","„wachsen“ ist der König. Er steht an zweiter Stelle."),
    TF(1,"Ein Hauptsatz kann allein stehen.",true,"„Die Sonne scheint hell.“ – Ist das ein ganzer Satz?","Richtig. Ein Hauptsatz ist ein vollständiger Satz."),
    MK(2,"Tippe den König an.","Am Abend|*singt|die Frau|auf dem Felsen.","Der König steht an zweiter Stelle – auch wenn der Satz nicht mit der Frau beginnt.","„singt“ steht an zweiter Stelle. „Am Abend“ ist die erste Stelle."),

    OR(3,"Baue einen Hauptsatz, der mit „Im Wald“ beginnt.",["Im Wald","lebt","ein Riese."],"Der König steht an zweiter Stelle.","Im Wald | lebt | ein Riese. – Der König „lebt“ steht an zweiter Stelle."),

    FR(3,"Schreibe zwei Hauptsätze über eine Sage. Achte darauf, dass der König an zweiter Stelle steht.","Beispiel: Der Drache bewacht den Schatz. Am Morgen kommt ein mutiger Ritter.\nKönige: „bewacht“ und „kommt“ – beide an zweiter Stelle.","Beginne einen Satz einmal mit einer Zeitangabe.")]),
   KAP(5,"Nebensatz – das Königskind","Ich erkenne Nebensätze und kann den König im Nebensatz bestimmen.","2026-11-25",[
    MC(1,"Wo steht der König im Nebensatz?",["ganz am Ende","an zweiter Stelle","immer als erstes Wort","in der Mitte"],"…, weil der Drache Feuer spuckt.","Im Nebensatz steht der König am Ende: weil der Drache Feuer spuckt."),
    TF(1,"Ein Nebensatz kann allein stehen.",false,"Lies nur „weil es regnet.“ Ist das ein ganzer Satz?","Falsch. Ein Nebensatz ist das Königskind. Er braucht einen Hauptsatz."),
    MK(1,"Tippe den König im Nebensatz an.","Die|Leute|staunen,|weil|der|Drache|Feuer|*spuckt.","Der König im Nebensatz steht am Ende.","„spuckt“ steht am Ende des Nebensatzes. Es ist dort der König."),

    GAP(2,"Wähle das passende Wort.","Im Hauptsatz steht der König an {0} Stelle. Im Nebensatz steht der König am {1}. Zwischen Hauptsatz und Nebensatz steht ein {2}.",[["zweiter","erster","letzter"],["Ende","Anfang","Rand"],["Komma","Punkt","Fragezeichen"]],"Denk an den König und das Königskind.","Hauptsatz: König an zweiter Stelle. Nebensatz: König am Ende. Dazwischen steht ein Komma."),

    OR(3,"Baue einen Nebensatz. Tippe die Wörter in der richtigen Reihenfolge an.",["weil","der","Riese","laut","schnarcht"],"Ein Nebensatz beginnt mit „weil“. Der König kommt ans Ende.","weil der Riese laut schnarcht – der König „schnarcht“ steht am Ende."),

   KAP(6,"Konjunktionen","Ich erkenne Konjunktionen und kann zwischen nebenordnenden und unterordnenden Konjunktionen unterscheiden.","2026-11-27",[
    SO(1,"Ordne die Konjunktionen zu.",["nebenordnend","unterordnend"],[["und",0],["weil",1],["oder",0],["dass",1],["aber",0],["obwohl",1],["denn",0],["wenn",1]],"Unterordnende Konjunktionen leiten einen Nebensatz ein. Dann steht der König am Ende.","Nebenordnend: und, oder, aber, denn. Unterordnend: weil, dass, obwohl, wenn."),

    GAP(2,"Wähle die passende Konjunktion.","Ich bleibe zu Hause, {0} es so stark regnet. Der Ritter ist mutig, {1} er hat trotzdem Angst.",[["weil","denn","und"],["aber","weil","dass"]],"Schau, wo der König steht: am Ende oder an zweiter Stelle?","…, weil es so stark regnet (König am Ende). …, aber er hat trotzdem Angst (König an zweiter Stelle)."),
    TF(2,"Vor „aber“ steht ein Komma.",true,"Er geht ins Kino, … sie bleibt zu Hause.","Richtig: Er geht ins Kino, aber sie bleibt zu Hause."),
    MC(3,"Welcher Satz ist richtig?",["Er bleibt im Boot, denn er hat Angst.","Er bleibt im Boot, denn er Angst hat.","Er bleibt im Boot, weil er hat Angst.","Er bleibt im Boot denn, er hat Angst."],"Nach „denn“ steht der König an zweiter Stelle. Nach „weil“ steht er am Ende.","„denn“ ist nebenordnend: denn er | hat | Angst. Richtig wäre auch: …, weil er Angst hat."),
    FR(3,"Verbinde mit einer unterordnenden Konjunktion: „Das Dorf feiert. Der Drache ist besiegt.“","Das Dorf feiert, weil der Drache besiegt ist.\nAuch möglich: …, da der Drache besiegt ist. / Nachdem der Drache besiegt ist, feiert das Dorf.","Nimm „weil“ und schiebe den König ans Ende.")]),
   KAP(7,"Satzreihe und Satzgefüge","Ich kann Satzreihen und Satzgefüge unterscheiden.","2026-11-30",[
    MC(1,"Was ist eine Satzreihe?",["Hauptsatz + Hauptsatz","Hauptsatz + Nebensatz","nur ein Nebensatz","ein Satz ohne Verb"],"Reihe: Gleiches steht nebeneinander.","Eine Satzreihe besteht aus zwei oder mehr Hauptsätzen."),
    MC(1,"Was ist ein Satzgefüge?",["Hauptsatz + Nebensatz","Hauptsatz + Hauptsatz","zwei Nebensätze ohne Hauptsatz","ein Satz mit Fragezeichen"],"Im Gefüge hängt etwas vom König ab.","Ein Satzgefüge besteht aus einem Hauptsatz und mindestens einem Nebensatz."),
    SO(2,"Satzreihe oder Satzgefüge?",["Satzreihe","Satzgefüge"],[["Der Ritter kämpft, aber der Drache ist stärker.",0],["Der Ritter kämpft, weil er das Dorf retten will.",1],["Die Frau singt, denn sie ist traurig.",0],["Wenn es dunkel wird, kommt der Geist.",1],["Es donnert, die Kinder laufen nach Hause.",0],["Alle wissen, dass der See tief ist.",1]],"Satzreihe = Hauptsatz + Hauptsatz. Satzgefüge = Hauptsatz + Nebensatz.","Ein Satzgefüge hat einen Nebensatz mit dem König am Ende. Eine Satzreihe hat nur Hauptsätze."),
    MC(2,"Wo fehlt das Komma? „Die Bauern freuen sich weil der Riese weiterzieht.“",["vor „weil“","nach „Bauern“","nach „weil“","vor „weiterzieht“"],"Das Komma steht zwischen Hauptsatz und Nebensatz.","Die Bauern freuen sich, weil der Riese weiterzieht."),
    MK(3,"Tippe das Wort an, vor das ein Komma gehört.","Die|Kinder|hören|zu|*obwohl|die|Sage|lang|ist.","Das Komma steht vor der Konjunktion, die den Nebensatz einleitet.","Die Kinder hören zu, obwohl die Sage lang ist."),
    FR(3,"Schreibe eine Satzreihe und ein Satzgefüge über eine Sage.","Satzreihe: Der Riese schläft, aber die Bauern sind wach.\nSatzgefüge: Die Bauern sind leise, weil der Riese schläft.","Satzreihe mit aber/denn/und, Satzgefüge mit weil/dass/wenn.")])]),
  SEC("Sagen lesen, verstehen und nacherzählen",[
   KAP(8,"Eine Sage lesen und verstehen","Ich kann eine Sage lesen und verstehen.","2026-12-04"),
   KAP(9,"Das trojanische Pferd","Ich kenne die Sage des trojanischen Pferdes und kann sie nacherzählen.","2026-12-07"),
   KAP(10,"Eine Sage nacherzählen","Ich kann eine Sage nacherzählen, die mir gefällt.","2026-12-11"),
   KAP(11,"Der Rattenfänger von Hameln","Ich kann die Sage „Der Rattenfänger von Hameln“ lesen, verstehen und nacherzählen.","2026-12-14")])]},
  {id:"6f-wus",titel:"Wortarten und Satzglieder",ziel:"Ich kann Wortarten und Satzglieder erkennen, bestimmen und richtig verwenden.",prefix:"",past:"Klassenarbeit am 9.11. geschrieben",sections:[

    OR(2,"Steigere das Adjektiv: Bringe die Formen in die richtige Reihenfolge.",["groß","größer","am größten"],"Grundform – Komparativ – Superlativ.","groß – größer – am größten."),
    GAP(3,"Wähle die richtige Form.","Der Riese ist {0} als der Zwerg. Der Drache ist am {1}.",[["stärker","stark","stärksten"],["stärksten","stärker","stark"]],"Bei „als“ brauchst du die erste Steigerungsstufe.","Der Riese ist stärker als der Zwerg. Der Drache ist am stärksten.")]),
   KAP(4,"Artikel","Ich kenne die Wortart Artikel und kann sie erkennen.","2026-09-30",[

    TF(3,"„eine“ ist ein unbestimmter Artikel.",true,"bestimmt: die – unbestimmt: …","Richtig. ein, eine sind unbestimmte Artikel.")]),

    MK(3,"Tippe alle Pronomen an.","*Er|gibt|*ihr|den|Hut.","Es sind zwei. „den“ ist ein Artikel.","„Er“ und „ihr“ sind Pronomen.")]),

    MK(2,"Tippe alle Präpositionen an.","Die|Katze|schläft|*unter|dem|Tisch|*neben|der|Tür.","Wo schläft die Katze?","„unter“ und „neben“ sind Präpositionen."),
    TF(3,"Präpositionen kann man verändern, zum Beispiel steigern.",false,"Kann man „unter“ steigern?","Falsch. Präpositionen bleiben immer gleich.")]),
   KAP(7,"Verben","Ich kenne die Wortart Verben und kann sie konjugieren.","2026-10-09",[

    MC(3,"Was ist die Grundform (Infinitiv) von „sang“?",["singen","sang","gesungen","singt"],"Die Grundform steht im Wörterbuch.","Die Grundform ist „singen“.")])]),
  SEC("Satzebene",[

    OR(2,"Umstellprobe: Der Satz soll mit „Morgen“ beginnen.",["Morgen","fahren","wir","nach Freiburg"],"Das Prädikat bleibt an zweiter Stelle.","Morgen | fahren | wir | nach Freiburg. Das Prädikat bleibt an zweiter Stelle."),
    MC(3,"Wie viele Satzglieder hat der Satz „Am Abend erzählt der Opa eine spannende Sage.“?",["4","5","7","3"],"Probiere die Umstellprobe aus.","Am Abend | erzählt | der Opa | eine spannende Sage – vier Satzglieder.")]),
   KAP(9,"Prädikat","Ich erkenne das Prädikat im Satz.","2026-10-21",[

    MK(2,"Tippe das Dativobjekt an.","Der Junge|schenkt|*seiner Oma|einen Blumenstrauß.","Wem schenkt der Junge etwas?","„seiner Oma“ ist das Dativobjekt."),
    MK(3,"Tippe das Dativobjekt an.","*Der Lehrerin|bringt|das Kind|einen Apfel.","Wem bringt das Kind etwas?","„Der Lehrerin“ – Wem? Das Dativobjekt steht hier vorn.")]),

    MK(2,"Tippe die adverbiale Bestimmung des Ortes an.","Nach der Schule|spielen|die Kinder|*im Park|Fußball.","Frage: Wo spielen die Kinder?","„im Park“ – Wo? „Nach der Schule“ sagt, wann."),

{id:"9d",name:"Klasse 9d",color:"#4f816d",faecher:[
 {id:"d",name:"Deutsch",icon:"book",color:"#4f816d",units:[
  {id:"9d-a2",titel:"A2: Materialgestützte Argumentation und dass / das",ziel:"Ich kann eine materialgestützte Argumentation schreiben. Ich kenne die Regeln der Kommasetzung. Ich kann dass und das korrekt anwenden.",prefix:"A2",ka:{d:"2027-01-29",txt:"Klassenarbeit",geplant:true},sections:[
  SEC("Argumente verstehen und aufbauen",[
   KAP(1,"Meine Meinung schriftlich begründen","Ich kann Argumente formulieren und meine Meinung schriftlich begründen.","2026-11-18",[
    MC(1,"Was gehört zu einer schriftlichen Stellungnahme?",["Deine Meinung und eine Begründung, warum du sie hast","Nur deine Meinung in einem Satz","Eine Nacherzählung des Themas","Eine Liste mit Fragen"],"Eine Meinung allein überzeugt noch niemanden.","Eine Stellungnahme nennt deine Meinung und begründet sie."),
    TF(1,"Eine Meinung ohne Begründung überzeugt die Leser:innen meistens nicht.",true,"Würde dich „Ich finde das blöd.“ überzeugen?","Richtig. Erst die Begründung macht eine Meinung nachvollziehbar."),
    MC(1,"Mit welchem Wort leitest du eine Begründung ein?",["weil","obwohl","trotzdem","aber"],"Welches Wort beantwortet die Frage „Warum?“","„weil“ (oder „denn“) leitet eine Begründung ein."),
    SO(2,"Tatsache oder Meinung?",["Tatsache","Meinung"],[["Eine Schulstunde dauert 45 Minuten.",0],["Die Schule beginnt viel zu früh.",1],["Die Schule beginnt um 7:45 Uhr.",0],["Ich finde, wir brauchen längere Pausen.",1],["Busfahren ist langweilig.",1],["Der Bus fährt alle 30 Minuten.",0]],"Eine Tatsache kann man überprüfen. Eine Meinung ist eine Bewertung.","Tatsachen lassen sich nachprüfen. Wörter wie „zu früh“ oder „langweilig“ zeigen eine Bewertung."),
    OR(2,"Bringe die Teile einer Stellungnahme in eine sinnvolle Reihenfolge.",["Thema und Anlass nennen","eigene Meinung nennen","Argumente mit Begründungen und Beispielen","Fazit: Meinung noch einmal bekräftigen"],"Einleitung – Hauptteil – Schluss.","Einleitung (Thema, Meinung), Hauptteil (Argumente), Schluss (Fazit)."),
    MC(3,"Welche Begründung überzeugt am meisten für „Die Schule sollte später beginnen“?",["Jugendliche sind morgens oft noch müde und können sich deshalb schlechter konzentrieren.","Ich habe keine Lust, früh aufzustehen.","Das sagen alle in meiner Klasse.","Es wäre einfach cooler."],"Eine gute Begründung betrifft viele und ist sachlich.","Die erste Begründung ist sachlich und betrifft alle Schüler:innen. Die anderen sind persönlich oder ohne Begründung."),
    FR(3,"Nimm in zwei bis drei Sätzen Stellung: Sollte es an deiner Schule einen Kiosk mit gesunden Snacks geben?","Ich bin für einen Kiosk mit gesunden Snacks, weil viele Schüler:innen ohne Frühstück in die Schule kommen und sich dann schlecht konzentrieren können. Ein Obstbecher oder ein Vollkornbrötchen in der großen Pause würde helfen, bis zum Mittag fit zu bleiben. Deshalb sollte die Schule das Angebot einführen.","Meinung + Begründung + Beispiel.")]),
   KAP(2,"Argumente ordnen","Ich kann Pro- und Contra-Argumente ordnen.","2026-11-18",[
    HA_SORT(1),
    TF(1,"In einer steigernden Argumentation steht das stärkste Argument am Ende.",true,"„steigern“ heißt: es wird immer mehr.","Richtig. Das stärkste Argument bildet den Höhepunkt."),
    MC(2,"In welcher Reihenfolge ordnest du Argumente in einer überzeugenden Argumentation meistens?",["vom schwächsten zum stärksten Argument","vom stärksten zum schwächsten Argument","alphabetisch","in zufälliger Reihenfolge"],"Was soll den Leser:innen am Ende im Kopf bleiben?","Steigernd: Das stärkste Argument kommt zum Schluss, damit es im Gedächtnis bleibt."),
    SO(2,"Thema: Handyverbot in der Pause. Pro oder Contra?",["Pro Verbot","Contra Verbot"],[["Schüler:innen bewegen sich in der Pause mehr.",0],["Man kann die Eltern im Notfall nicht erreichen.",1],["Es gibt weniger Cybermobbing während der Schulzeit.",0],["Jugendliche sollen lernen, selbst Verantwortung zu übernehmen.",1],["Die Schüler:innen unterhalten sich mehr miteinander.",0],["Das Handy wird auch für Lern-Apps genutzt.",1]],"Frage dich bei jedem Satz: Spricht das für oder gegen ein Verbot?","Pro: Bewegung, weniger Cybermobbing, mehr Gespräche. Contra: Notfall, Eigenverantwortung, Lern-Apps."),
    MC(3,"Wann ist ein Argument besonders stark?",["Wenn es viele Menschen betrifft und gut belegt ist","Wenn es besonders lang ist","Wenn es laut vorgetragen wird","Wenn es ein Fremdwort enthält"],"Denk an Begründung und Beleg.","Starke Argumente sind relevant für viele und durch Fakten oder Beispiele belegt."),
    FR(3,"Wähle drei Pro-Argumente für Hausaufgaben und ordne sie steigernd. Begründe kurz, warum das letzte am stärksten ist.","1. Man lernt, selbstständig zu arbeiten.\n2. Durch Hausaufgaben wiederholt man die Themen des Unterrichts.\n3. Hausaufgaben bereiten auf Klassenarbeiten vor.\nDas letzte ist am stärksten, weil es direkt mit besseren Leistungen zu tun hat und alle betrifft.","Schwächstes zuerst, stärkstes zuletzt.")]),
   KAP(3,"Aufbau eines Arguments","Ich kenne den Aufbau eines Arguments und unterscheide Behauptung, Begründung und Beispiel.","2026-11-20",[
    OR(1,"Bringe die Teile eines Arguments in die richtige Reihenfolge.",["Behauptung","Begründung","Beispiel"],"Zuerst sagst du, was du denkst.","Behauptung – Begründung – Beispiel."),
    MA(1,"Ordne zu.",[["Behauptung","Das willst du beweisen."],["Begründung","Damit erklärst du, warum die Behauptung stimmt."],["Beispiel","Damit zeigst du die Begründung an einem konkreten Fall."]],"Die Begründung beantwortet „Warum?“.","Behauptung = These, Begründung = Warum?, Beispiel = konkreter Fall."),
    MC(1,"Welche Formulierung leitet oft ein Beispiel ein?",["beispielsweise","weil","deshalb","obwohl"],"Das Wort steckt fast schon im Namen.","„beispielsweise“ oder „zum Beispiel“ leiten ein Beispiel ein."),
    SO(2,"Ordne die Teile den Bausteinen zu.",["Behauptung","Begründung","Beispiel"],[["Schuluniformen stärken die Klassengemeinschaft,",0],["weil niemand wegen seiner Kleidung ausgegrenzt wird.",1],["So muss sich beispielsweise niemand für ältere Turnschuhe schämen.",2],["Jugendliche können sich schlechter konzentrieren,",0],["denn kurze Videos gewöhnen das Gehirn an schnelle Reize.",1],["Zum Beispiel fällt es vielen schwer, einen langen Text am Stück zu lesen.",2]],"Achte auf die Signalwörter: weil, denn, beispielsweise, zum Beispiel.","Es sind zwei vollständige Argumente: je eine Behauptung, eine Begründung (weil/denn) und ein Beispiel."),
    MC(2,"Welcher Baustein fehlt? „Hausaufgaben sind sinnvoll, weil man den Stoff dadurch wiederholt.“",["das Beispiel","die Behauptung","die Begründung","nichts, es ist vollständig"],"Gibt es einen konkreten Fall?","Behauptung und Begründung sind da. Es fehlt ein Beispiel, z. B. Vokabeln, die man durch Wiederholen besser behält."),
    MC(2,"Welches Beispiel passt? „Sport in der Schule ist wichtig, weil Bewegung die Gesundheit fördert.“",["Wer sich regelmäßig bewegt, hat beispielsweise seltener Rückenschmerzen.","Fußball ist eine beliebte Sportart.","Sportlehrer tragen oft Trainingsanzüge.","Die Turnhalle ist groß."],"Das Beispiel muss die Begründung (Gesundheit) zeigen.","Nur das erste Beispiel passt zur Begründung „Gesundheit“."),
    MC(3,"Was ist der Unterschied zwischen Begründung und Beispiel?",["Die Begründung erklärt allgemein, warum etwas stimmt; das Beispiel zeigt einen konkreten Fall.","Es gibt keinen Unterschied.","Das Beispiel kommt immer vor der Begründung.","Die Begründung ist immer eine Zahl."],"Allgemein – konkret.","Begründung = allgemeine Erklärung. Beispiel = konkreter Fall, der die Begründung stützt."),
    TF(3,"Ein Beispiel kann die Begründung ersetzen.",false,"Ein Einzelfall erklärt noch nicht, warum etwas allgemein gilt.","Falsch. Ein Beispiel stützt die Begründung, ersetzt sie aber nicht."),
    FR(3,"Schreibe ein vollständiges Argument (Behauptung, Begründung, Beispiel) zum Thema: Soll das Schuljahr mit einer Projektwoche beginnen?","Eine Projektwoche zum Schuljahresbeginn ist sinnvoll, weil sich die Klasse dabei besser kennenlernt. So können zum Beispiel neue Mitschüler:innen beim gemeinsamen Planen eines Ausflugs schnell Anschluss finden.","Signalwörter: weil … / zum Beispiel …")]),
   KAP(4,"Gegenargumente entkräften","Ich kann ein Gegenargument aufgreifen und entkräften.","2026-11-20",[
    MC(1,"Was bedeutet „ein Gegenargument entkräften“?",["Ein Argument der Gegenseite aufgreifen und zeigen, warum es nicht überzeugt","Ein Gegenargument einfach weglassen","Der Gegenseite recht geben","Ein eigenes Argument wiederholen"],"„entkräften“ = die Kraft nehmen.","Du nennst das Gegenargument und zeigst, warum es schwächer ist als deine Position."),
    GAP(1,"Wähle die passenden Wörter.","{0} lernt man mit Nachmittagsunterricht vielleicht mehr, {1} die Konzentration lässt am Nachmittag stark nach.",[["Zwar","Weil","Denn"],["aber","weil","also"]],"Eine typische Kombination zum Entkräften.","„Zwar …, aber …“: Du gibst etwas zu und schränkst es dann ein."),
    MC(1,"Welche Formulierung leitet ein Gegenargument ein?",["Manche meinen, dass …","Zum Beispiel …","Deshalb …","Zusammenfassend …"],"Wer sagt hier etwas anderes als du?","„Manche meinen, dass …“ greift die Sicht der Gegenseite auf."),
    OR(2,"Bringe die Schritte beim Entkräften in eine sinnvolle Reihenfolge.",["Gegenargument nennen","teilweise zustimmen","mit eigener Begründung entkräften","zur eigenen Position zurückkehren"],"Erst kommt die Gegenseite zu Wort.","Gegenargument – Zugeständnis – Entkräftung – Rückbezug auf die eigene Position."),
    MC(2,"Gegenargument: „Mit Nachmittagsunterricht verbringt ihr weniger Zeit am Handy.“ Welche Entkräftung überzeugt am meisten?",["Zwar ist man in der Schule weniger am Handy, doch viele holen die Zeit am Abend nach – dann fehlt sogar Schlaf.","Das stimmt nicht.","Handys sind toll.","Das ist mir egal."],"Eine Entkräftung braucht eine Begründung.","Nur die erste Antwort gibt etwas zu und begründet, warum das Argument trotzdem nicht trägt."),
    MA(2,"Ordne die Formulierungen ihrer Aufgabe zu.",[["Befürworter:innen behaupten, …","Gegenargument nennen"],["Es stimmt zwar, dass …","Zugeständnis"],["Dem ist entgegenzuhalten, dass …","Entkräftung"],["Daher bleibt festzuhalten, dass …","Schlussfolgerung"]],"Achte auf die Signalwörter „zwar“ und „entgegenhalten“.","So klingt eine sprachlich saubere Entkräftung."),
    TF(2,"Beim Entkräften darfst du die Gegenseite ruhig lächerlich machen.",false,"Wie wirkt das auf Leser:innen?","Falsch. Bleib sachlich – sonst verlierst du an Glaubwürdigkeit."),
    MC(3,"Welche Strategie nutzt dieser Satz? „Das gilt aber nur für einen kleinen Teil der Schüler:innen.“",["einschränken","widerlegen mit Gegenbeweis","zustimmen","ein Beispiel geben"],"Wird das Argument ganz bestritten oder nur kleiner gemacht?","Das Argument wird eingeschränkt: Es stimmt nur für wenige."),
    TF(3,"Ein entkräftetes Gegenargument zeigt, dass du dich mit der anderen Seite beschäftigt hast.",true,"Was denkt der Leser über dich?","Richtig. Das macht deine Argumentation glaubwürdiger."),
    FR(3,"Entkräfte dieses Gegenargument: „Schuluniformen sind zu teuer.“","Zwar kostet eine Schuluniform zunächst Geld, doch auf Dauer sparen Familien, weil sie weniger teure Markenkleidung für die Schule kaufen müssen. Außerdem könnte die Schule Zuschüsse für Familien anbieten, die sich die Kleidung nicht leisten können.","Zwar … doch … + Begründung.")])]),
  SEC("Mit Material arbeiten",[
   KAP(5,"Argumente aus einem Sachtext herausarbeiten","Ich kann mithilfe der 3-Schritt-Lesemethode aus einem Sachtext Argumente herausarbeiten.","2026-11-25",SACHTEXT_OEPNV()),
   KAP(6,"Richtig zitieren","Ich kann auf Material verweisen und richtig zitieren.","2026-11-27",[
    TF(1,"Bei einem wörtlichen Zitat setzt du Anführungszeichen.",true,"Woran erkennt man, dass etwas wörtlich übernommen ist?","Richtig. Und du nennst die Quelle, z. B. (M2, Z. 4)."),
    MC(1,"Wie gibst du die Quelle eines Zitats an?",["(M2, Z. 7)","(irgendwo im Text)","(Internet)","(M2, irgendwo)"],"Material und Zeile.","Material und Zeile, z. B. (M2, Z. 7)."),
    MC(1,"Was ist ein Verweis?",["Du gibst den Inhalt eines Materials in eigenen Worten wieder und nennst die Quelle.","Du schreibst einen Satz wörtlich ab.","Du erfindest eine Quelle.","Du lässt das Material weg."],"Verweisen = auf etwas zeigen.","Ein Verweis gibt den Inhalt sinngemäß wieder, z. B.: Laut M1 …"),
    TF(1,"Beim Zitieren darfst du Wörter verändern, wenn es dann besser klingt.",false,"Zitat heißt: wörtlich.","Falsch. Ein Zitat bleibt wörtlich. Auslassungen kennzeichnest du mit […]."),
    SO(2,"Zitat oder Verweis?",["Zitat","Verweis"],[["Laut M1 fahren viele Jugendliche mit dem Bus zur Schule.",1],["In M2 heißt es: „Der Bus kommt oft zu spät“ (M2, Z. 4).",0],["Wie die Grafik in M3 zeigt, steigen die Preise.",1],["„Viele Linien fahren nur stündlich“ (M1, Z. 12).",0]],"Sind Anführungszeichen da?","Zitate stehen in Anführungszeichen. Verweise geben den Inhalt mit eigenen Worten wieder."),
    MC(2,"Wie kennzeichnest du eine Auslassung in einem Zitat?",["[…]","***","//","?!"],"Eckige Klammern.","Mit eckigen Klammern und drei Punkten: […]"),
    MC(2,"Welche Formulierung leitet einen Verweis ein?",["Wie aus M2 hervorgeht, …","Ich finde, …","Zum Schluss …","Erstens …"],"Es muss ein Material genannt werden.","„Wie aus M2 hervorgeht“ verweist auf ein Material."),
    OR(2,"Bringe die Bausteine eines Arguments mit Materialbeleg in eine sinnvolle Reihenfolge.",["Behauptung","Begründung","Beleg aus dem Material (Verweis oder Zitat)","Rückbezug auf die Behauptung"],"Der Beleg stützt die Begründung.","Behauptung – Begründung – Beleg – Rückbezug."),
    MC(3,"Welcher Satz zitiert korrekt?",["In M1 heißt es, dass „viele Jugendliche […] auf das Elterntaxi angewiesen“ sind (M1, Z. 2).","In M1 heißt es, dass viele Jugendliche auf das Elterntaxi angewiesen sind.","In M1 heißt es: „Jugendliche brauchen immer ihre Eltern“ (M1, Z. 2).","„Viele Jugendliche […] Elterntaxi“"],"Anführungszeichen, Auslassung, Quelle – alles muss stimmen.","Nur der erste Satz hat Anführungszeichen, eine gekennzeichnete Auslassung und eine Quellenangabe."),
    TF(3,"Für ein gutes Argument reicht ein Zitat – erklären musst du es nicht.",false,"Was soll der Leser mit dem Zitat anfangen?","Falsch. Ein Zitat musst du erläutern und mit deiner Behauptung verbinden."),
    FR(3,"Material M1 (ausgedacht): „Auf dem Land fährt der Bus oft nur einmal pro Stunde. Viele Jugendliche sind deshalb auf das Elterntaxi angewiesen.“ Formuliere daraus ein Argument mit Verweis.","Der Busverkehr auf dem Land sollte ausgebaut werden, denn ohne gute Verbindungen sind Jugendliche von ihren Eltern abhängig. Wie M1 zeigt, fährt der Bus auf dem Land oft nur einmal pro Stunde, sodass viele auf das Elterntaxi angewiesen sind (vgl. M1, Z. 1–2). Ein dichterer Takt würde Jugendlichen also mehr Selbstständigkeit geben.","Behauptung – Begründung – „Wie M1 zeigt …“ – Rückbezug.")]),
   KAP(7,"Operatoren","Ich kenne die Operatoren der Prüfung und weiß, was sie verlangen.","2026-12-02")]),
  SEC("Richtig schreiben beim Argumentieren",[
   KAP(8,"Kommasetzung in Satzgefügen","Ich kann Kommas in Satzgefügen korrekt setzen.","2026-12-04"),
   KAP(9,"dass und das","Ich kann dass und das sicher unterscheiden.","2026-12-09"),
   KAP(10,"Einen dass-Satz in eine Infinitivgruppe umwandeln","Ich kann einen dass-Satz in eine Infinitivgruppe umwandeln.","2026-12-11"),
   KAP(11,"Parenthese","Ich kann eine Parenthese erkennen und mit Kommas abtrennen.","2026-12-11")]),
  SEC("Eine Argumentation schreiben",[
   KAP(12,"Aufbau einer Argumentation","Ich kenne den Aufbau einer materialgestützten Argumentation.","2026-12-16"),
   KAP(13,"Eine Argumentation planen, schreiben und überarbeiten","Ich kann eine Argumentation planen, schreiben und überarbeiten.","2027-01-15"),
   KAP(14,"Prüfungsaufgabe","Ich kann eine vollständige Prüfungsaufgabe bearbeiten.","2027-01-22")])]}]},
 {id:"gk",name:"Gemeinschaftskunde",icon:"landmark",color:"#7867b7",units:[
  {id:"9d-pw",titel:"Politischer Willensbildungsprozess",ziel:"Ich kann beschreiben, welche Möglichkeiten ich habe, meine Interessen in den politischen Entscheidungsprozess einzubringen.",prefix:"Kapitel",ka:{d:null,txt:"Klassenarbeit"},sections:[
  SEC("Politische Partizipation",[
   KAP(1,"Politische Teilhabe – mehr als nur Wählen?","Ich kann beschreiben, was Partizipation ist.","2026-10-13",[
    MC(1,"Was bedeutet politische Partizipation?",["sich an politischen Entscheidungen beteiligen","nur Nachrichten schauen","einer Sportart nachgehen","ein politisches Amt erben"],"Partizipation = Teilhabe.","Partizipation heißt, sich an Politik zu beteiligen – z. B. wählen, demonstrieren, Petitionen unterschreiben."),
    TF(1,"Politische Partizipation besteht nur aus Wählen.",false,"Erinnere dich an die Meinungslinie.","Falsch. Auch Demonstrationen, Petitionen, Parteiarbeit oder Social Media gehören dazu."),
    TF(2,"Das Grundgesetz garantiert das Recht, sich friedlich und ohne Waffen zu versammeln.",true,"Artikel 8.","Richtig. Das ist die Versammlungsfreiheit (Art. 8 GG)."),
    MC(3,"Welches Recht nutzt du, wenn du dich mit einer Bitte an den Landtag wendest?",["Petitionsrecht","Wahlrecht","Versammlungsrecht","Hausrecht"],"Artikel 17 GG.","Das Petitionsrecht (Art. 17 GG) erlaubt Bitten und Beschwerden an Parlamente und Behörden.")]),
   KAP(2,"Möglichkeiten der politischen Partizipation","Ich kenne Möglichkeiten, sich politisch zu engagieren.","2026-10-13",[
    MA(1,"Ordne zu.",[["Petition","eine schriftliche Bitte oder Beschwerde an ein Parlament"],["Demonstration","eine öffentliche Versammlung für oder gegen etwas"],["Wahl","Abgeordnete für eine bestimmte Zeit bestimmen"],["Partei","eine Vereinigung, die politische Ziele verfolgt und bei Wahlen antritt"]],"Eine Petition schreibt man.","So kann man sich politisch einbringen."),
    MC(2,"Welche Möglichkeit hast du schon mit 14 Jahren?",["eine Petition unterschreiben oder starten","bei der Bundestagswahl wählen","in den Bundestag gewählt werden","Bürgermeister:in werden"],"Für Petitionen gibt es keine Altersgrenze.","Petitionen kann jede und jeder einreichen – unabhängig vom Alter."),
    FR(3,"Welche Form der Beteiligung passt am besten zu dir? Begründe in zwei Sätzen.","Beispiel: Mir passt eine Petition am besten, weil ich mich damit für ein konkretes Anliegen einsetzen kann, zum Beispiel für einen besseren Busanschluss. Außerdem kann ich online viele Unterstützer:innen sammeln, ohne schon wählen zu dürfen.","Form nennen + Begründung + Beispiel.")]),
   KAP(3,"Alles fake? Fake News untersuchen","Ich kenne die Aufgaben, die Medien erfüllen.","2026-10-20",[
    MC(1,"Warum nennt man Medien die „vierte Gewalt“?",["Weil sie Politik kontrollieren und Missstände öffentlich machen","Weil sie Gesetze beschließen","Weil sie Gerichte ersetzen","Weil sie die Polizei leiten"],"Die drei anderen Gewalten sind Gesetzgebung, Regierung und Gerichte.","Medien kontrollieren die drei Staatsgewalten, indem sie berichten und kritisieren."),
    MA(2,"Ordne die Aufgaben der Medien zu.",[["Information","Die Nachrichten berichten über ein neues Gesetz."],["Meinungsbildung","Ein Kommentar stellt Pro und Contra zum Wahlalter 16 dar."],["Kritik und Kontrolle","Eine Zeitung deckt auf, dass Steuergeld verschwendet wurde."]],"Kontrolle = etwas aufdecken.","Information, Meinungsbildung, Kritik und Kontrolle sind die drei Hauptaufgaben."),
    MC(2,"Woran erkennst du am ehesten eine Fake News?",["Sie nennt keine Quelle und erscheint nur auf einer einzigen Seite.","Sie steht in mehreren seriösen Zeitungen.","Sie hat ein Datum und eine Autorin.","Sie ist sachlich formuliert."],"Woran erkennst du seriöse Nachrichten?","Fehlende Quellen und keine Bestätigung durch andere Medien sind Warnsignale."),
    SO(3,"Seriöser Hinweis oder Warnsignal?",["seriös","Warnsignal"],[["Impressum vorhanden",0],["reißerische Überschrift mit vielen Ausrufezeichen",1],["Autor:in und Datum sind angegeben",0],["kein Datum, keine Quelle",1],["Andere Nachrichtenseiten berichten dasselbe",0],["„Teile das sofort, bevor es gelöscht wird!“",1]],"Wer zeigt, wer er ist – und wer setzt dich unter Druck?","Druck, fehlende Quellen und Übertreibung sind Warnsignale.")]),
   KAP(4,"Eignet sich TikTok zur politischen Information?","Ich kann beurteilen, ob TikTok sich eignet, um sich politisch zu informieren.","2026-10-20",[
    TF(1,"Der TikTok-Algorithmus zeigt dir vor allem Inhalte, die dir wahrscheinlich gefallen.",true,"Warum ist die „Für dich“-Seite so persönlich?","Richtig. Deshalb sieht man oft immer mehr vom Gleichen."),
    MC(2,"Was ist ein Risiko, wenn man sich nur über TikTok informiert?",["Man sieht oft einseitige Inhalte und kaum andere Meinungen.","Die Videos sind zu lang.","TikTok ist in Deutschland verboten.","Man bekommt zu viele Zeitungsartikel."],"Denk an den Algorithmus.","Einseitige Inhalte und Falschinformationen verbreiten sich schnell."),
    FR(3,"Eignet sich TikTok, um sich politisch zu informieren? Nenne ein Argument und eine Einschränkung.","Argument: TikTok erreicht viele Jugendliche und kann politische Themen kurz und verständlich erklären.\nEinschränkung: Der Algorithmus zeigt oft einseitige Inhalte, und Falschinformationen verbreiten sich schnell. Deshalb sollte man Informationen mit seriösen Quellen vergleichen.","Pro + Einschränkung (aber …).")])]),
  SEC("Parteien",[
   KAP(5,"Wie ist die Arbeit in einer Partei?","Ich kenne die Aufgaben, die Parteimitglieder erfüllen.","2026-11-10",[
    MC(1,"Was steht in Artikel 21 des Grundgesetzes über Parteien?",["Sie wirken bei der politischen Willensbildung des Volkes mit.","Sie schreiben alle Gesetze allein.","Sie sprechen Urteile vor Gericht.","Es darf nur eine Partei geben."],"„mitwirken“ ist das Schlüsselwort.","Art. 21 GG: Die Parteien wirken bei der politischen Willensbildung des Volkes mit."),
    TF(1,"Parteien stellen Kandidat:innen für Wahlen auf.",true,"Wer steht auf dem Stimmzettel?","Richtig. Das ist eine ihrer wichtigsten Aufgaben."),
    MC(1,"Was ist ein Wahlprogramm?",["Die Ziele, die eine Partei nach der Wahl umsetzen will","Der Ablauf am Wahltag","Eine Liste aller Wähler:innen","Ein Fernsehprogramm"],"Es geht um Pläne.","Im Wahlprogramm stehen die Ziele einer Partei."),
    TF(1,"Wer Mitglied einer Partei ist, muss Berufspolitiker:in werden.",false,"Die meisten Mitglieder haben einen ganz normalen Beruf.","Falsch. Die meisten Parteimitglieder engagieren sich ehrenamtlich."),
    SO(2,"Ist das eine Aufgabe von Parteien?",["ja","nein"],[["Interessen von Bürger:innen bündeln",0],["Kandidat:innen für Wahlen aufstellen",0],["Gerichtsurteile fällen",1],["über politische Themen informieren",0],["Steuern einziehen",1],["eine Regierung bilden oder als Opposition kontrollieren",0]],"Gerichte und Finanzämter sind keine Parteien.","Parteien bündeln Interessen, stellen Kandidat:innen auf, informieren und bilden Regierung oder Opposition."),
    MC(2,"Was machen Parteimitglieder in einem Ortsverband NICHT?",["Gesetze im Bundestag beschließen","Infostände in der Fußgängerzone betreuen","bei Versammlungen über Ziele abstimmen","Plakate im Wahlkampf aufhängen"],"Wer sitzt im Bundestag?","Gesetze beschließen nur die gewählten Abgeordneten im Parlament."),
    MC(2,"Junge Union, Jusos, Grüne Jugend und Junge Liberale sind …",["Jugendorganisationen von Parteien","Fußballvereine","Schülerzeitungen","Gewerkschaften"],"Junge Leute, die einer Partei nahestehen.","Das sind Jugendorganisationen von Parteien."),
    TF(2,"Parteien finanzieren sich unter anderem durch Mitgliedsbeiträge, Spenden und staatliche Zuschüsse.",true,"Woher kommt das Geld für Plakate und Büros?","Richtig. Diese drei Quellen sind die wichtigsten."),
    MC(3,"Was unterscheidet eine Partei von einer Bürgerinitiative?",["Eine Partei tritt bei Wahlen an und will dauerhaft Verantwortung übernehmen; eine Bürgerinitiative setzt sich meist für ein einzelnes Anliegen ein.","Es gibt keinen Unterschied.","Eine Bürgerinitiative sitzt im Bundestag.","Parteien kümmern sich nur um ein einziges Thema."],"Denk an Wahlen und an die Zahl der Themen.","Parteien haben Programme zu vielen Themen und treten bei Wahlen an."),
    MC(3,"Was ist die Aufgabe der Opposition?",["Die Regierung kontrollieren und Alternativen vorschlagen","Die Regierung immer unterstützen","Gesetze allein beschließen","Wahlen organisieren"],"Opposition = Gegenposition.","Die Opposition kontrolliert und kritisiert die Regierung und macht eigene Vorschläge."),
    FR(3,"Nenne zwei Gründe, warum sich Jugendliche in einer Partei engagieren könnten, und einen Grund, warum viele es nicht tun.","Gründe dafür: Man kann bei Themen mitreden, die einen selbst betreffen (z. B. Schule, Klima, Busverkehr), und man lernt, wie Politik funktioniert.\nGrund dagegen: Parteiarbeit kostet viel Zeit, und viele Jugendliche finden Parteien weit weg von ihrem Alltag.","Denk an Mitbestimmung, Lernen, Zeit.")])]),
  SEC("Wahlen",[
   KAP(6,"Wahlgrundsätze","Ich kenne die Wahlgrundsätze.","2026-11-17",[
    MC(1,"Wie viele Wahlgrundsätze nennt Artikel 38 des Grundgesetzes?",["fünf","drei","vier","sechs"],"allgemein, unmittelbar, …","Fünf: allgemein, unmittelbar, frei, gleich und geheim."),
    MA(1,"Ordne jedem Wahlgrundsatz seine Bedeutung zu.",[["allgemein","Alle Staatsbürger:innen ab einem Mindestalter dürfen wählen."],["unmittelbar","Die Abgeordneten werden direkt gewählt, ohne Zwischenpersonen."],["frei","Niemand darf zu einer bestimmten Wahl gezwungen werden."],["gleich","Jede Stimme zählt gleich viel."],["geheim","Niemand darf erfahren, wen du gewählt hast."]],"„gleich“ hat mit dem Gewicht der Stimme zu tun.","So schützt das Grundgesetz faire Wahlen."),
    TF(1,"„Geheim“ bedeutet: Niemand darf herausfinden, wen du gewählt hast.",true,"Wozu gibt es die Wahlkabine?","Richtig. Deshalb wählt man in der Wahlkabine."),
    SO(2,"Welcher Wahlgrundsatz wird verletzt?",["allgemein","unmittelbar","frei","gleich","geheim"],[["Nur Menschen mit hohem Einkommen dürfen wählen.",0],["Die Bürger:innen wählen Wahlleute, die dann die Abgeordneten bestimmen.",1],["Der Chef sagt seinen Angestellten, wen sie wählen müssen.",2],["Die Stimme von Rentner:innen zählt nur halb.",3],["Alle müssen ihren Stimmzettel offen vorzeigen.",4]],"Lies noch einmal die Bedeutungen der fünf Grundsätze.","Einkommen → allgemein; Wahlleute → unmittelbar; Zwang → frei; halbe Stimme → gleich; offen zeigen → geheim."),
    MC(2,"„Gleiche Wahl“ bedeutet …",["Jede Stimme hat das gleiche Gewicht.","Alle wählen dieselbe Partei.","Alle wählen am selben Tag.","Jede Partei hat gleich viele Kandidat:innen."],"Es geht um das Gewicht.","Gleich: Jede Stimme zählt gleich viel."),
    TF(2,"In Deutschland gibt es eine Wahlpflicht.",false,"Denk an den Grundsatz „frei“.","Falsch. Zur freien Wahl gehört auch, dass man nicht wählen muss."),
    FR(3,"Jemand schlägt vor: Wer über 80 ist, soll nicht mehr wählen dürfen. Welcher Wahlgrundsatz wäre verletzt? Begründe.","Verletzt wäre die allgemeine Wahl. Sie bedeutet, dass alle Staatsbürger:innen ab dem Mindestalter wählen dürfen. Ein Höchstalter würde eine ganze Gruppe ausschließen – nur wegen ihres Alters.","Wer darf wählen?")]),
   KAP(7,"Wahlen ab 16","Ich kann erläutern, ob Wahlen ab 16 sein sollten.","2026-11-17",[
    MC(1,"Ab welchem Alter darf man bei der Bundestagswahl wählen?",["18","16","14","21"],"Volljährigkeit.","Bei der Bundestagswahl darf man ab 18 wählen."),
    TF(2,"In Baden-Württemberg darf man bei der Landtagswahl schon ab 16 wählen.",true,"Die Landtagswahl im März 2026 war die erste mit dieser Regel.","Richtig. Das hat der Landtag 2022 beschlossen. Bei Kommunalwahlen in BW gilt das schon seit 2014."),
    SO(2,"Wahlen ab 16: Pro oder Contra?",["Pro","Contra"],[["Jugendliche sind von heutigen Entscheidungen noch lange betroffen, z. B. beim Klimaschutz.",0],["Viele 16-Jährige interessieren sich noch wenig für Politik.",1],["Wer früh wählt, gewöhnt sich ans Wählen.",0],["Mit 16 ist man noch nicht volljährig.",1],["Jugendliche können leichter beeinflusst werden, etwa über Social Media.",1],["Die Politik würde Themen junger Menschen stärker beachten.",0]],"Frage dich jeweils: Spricht das für oder gegen eine Wahl ab 16?","Pro: Betroffenheit, Gewöhnung, mehr Beachtung. Contra: wenig Interesse, nicht volljährig, Beeinflussbarkeit."),
    MC(3,"Bei welcher Wahl dürfen 16-Jährige seit 2024 in ganz Deutschland wählen?",["bei der Europawahl","bei der Bundestagswahl","bei der Bundespräsidentenwahl","bei keiner Wahl"],"Es geht um das Parlament der EU.","Seit 2024 gilt bei der Europawahl in Deutschland das Wahlalter 16."),
    FR(3,"Sollte das Wahlalter bei Bundestagswahlen auf 16 sinken? Nenne ein Argument für deine Position und entkräfte ein Gegenargument.","Beispiel: Das Wahlalter sollte auf 16 sinken, weil Jugendliche von heutigen Entscheidungen am längsten betroffen sind. Zwar sagen manche, 16-Jährige interessierten sich kaum für Politik, doch wer früh wählen darf, beschäftigt sich auch eher damit – das zeigen die Landtagswahlen ab 16.","Argument + „Zwar …, doch …“.")]),
   KAP(8,"Wahlen – wie erreicht man Wähler:innen?","Ich kann beschreiben, wie Parteien Menschen überzeugen.","2026-11-24",[
    MC(1,"Wie nennt man die Zeit vor einer Wahl, in der Parteien um Stimmen werben?",["Wahlkampf","Wahlpause","Wahlpflicht","Wahlgeheimnis"],"Es wird um Stimmen „gekämpft“.","Im Wahlkampf werben Parteien um Stimmen."),
    TF(1,"Wahlplakate gehören zu den klassischen Mitteln im Wahlkampf.",true,"Was hängt vor Wahlen an Laternen?","Richtig."),
    MC(1,"Was steht typischerweise auf einem Wahlplakat?",["Ein kurzer Slogan, ein Foto und der Name der Partei","Das ganze Wahlprogramm","Die Ergebnisse der letzten Wahl","Die Telefonnummer aller Kandidat:innen"],"Plakate muss man im Vorbeigehen lesen können.","Plakate sind kurz: Slogan, Bild, Partei."),
    MC(1,"Was ist ein Slogan?",["ein kurzer, einprägsamer Werbespruch","ein langes Interview","eine Abstimmung","ein Gesetz"],"Ein Satz, den man sich merkt.","Ein Slogan ist ein kurzer Werbespruch."),
    MA(2,"Ordne die Wahlkampfmittel zu.",[["Infostand","Parteimitglieder sprechen in der Fußgängerzone mit Bürger:innen."],["Wahlwerbespot","kurzer Werbefilm im Fernsehen oder im Internet"],["TV-Duell","Spitzenkandidat:innen diskutieren live im Fernsehen."],["Social-Media-Kampagne","kurze Videos und Posts für junge Zielgruppen"]],"Denk daran, wo du das jeweils siehst.","Parteien nutzen viele Kanäle, um unterschiedliche Gruppen zu erreichen."),
    MC(2,"Warum setzen Parteien heute stark auf TikTok und Instagram?",["Weil sie dort junge Menschen erreichen, die kaum Zeitung lesen oder fernsehen","Weil Plakate verboten sind","Weil es Pflicht ist","Weil dort nur Politiker:innen sind"],"Wo sind junge Leute unterwegs?","Junge Menschen informieren sich oft über Social Media."),
    TF(2,"Der Wahl-O-Mat wird von einer Partei herausgegeben.",false,"Er soll neutral sein.","Falsch. Der Wahl-O-Mat kommt von der Bundeszentrale für politische Bildung."),
    TF(2,"Wahlplakate erklären meistens ausführlich das ganze Wahlprogramm.",false,"Wie lange schaust du auf ein Plakat?","Falsch. Plakate vereinfachen stark."),

    MC(3,"Was ist an Wahlwerbung kritisch zu sehen?",["Sie zeigt meist nur die Stärken der eigenen Partei und vereinfacht stark.","Sie ist immer gelogen.","Sie ist verboten.","Sie ist zu lang."],"Würde eine Partei ihre Schwächen zeigen?","Werbung ist einseitig. Deshalb lohnt sich ein Vergleich, z. B. mit dem Wahl-O-Mat."),
